name: Worker CI

# =============================================================================
# 业务仓 CI 门面（唯一入口）— Worker 仓请只 uses 本文件，勿直接拼 leaf workflow。
# =============================================================================
# 内嵌：verify / ensure-release-pr / qodana / AI review（可选）/ release-auto-merge / notify-blocked
#
# 成本策略（actions/v0.2.7+）：
#   - Release PR 默认创建即 ready；门禁全绿 + require_non_draft_pr 后 auto-merge → Cloudflare Builds
#   - workflow_call.secrets 须声明（与 actions/v0.2.6 同集）；actions/v0.2.7 tag 误删该块会导致 caller 显式 secrets: 映射 startup_failure — 合 master 后预期 actions/v0.2.8 patch；caller 可用 secrets: inherit 或显式映射下列 secrets
#   - push 默认不跑 verify / workflow-lint；verify 仅在 pull_request（门禁）；push 仍跑 sync-lock，ensure 等其完成（#132）
#   - skip_ai_review / Qodana 未启用时 job 级不启动（不跑 skip-ack 空 runner）
#   - github-actions[bot]（lock-bot）跳过 lint/verify/qodana/ai-review/ensure
#
# Caller（业务仓 .github/workflows/ci.yml）典型用法：
#   permissions:
#     contents: write
#     packages: read
#     pull-requests: write
#     issues: write
#     actions: write   # nested qodana（PR 限频 cache）
#     checks: read     # nested notify-blocked
#   uses: workers-world/worker-actions/.github/workflows/worker-ci.yml@actions/v0.2.48
#   secrets: inherit   # 或显式映射 workflow_call.secrets 全集（zizmor secrets-inherit / medium）
#   with:
#     sync_packages_lock: true
#
# SDK 版本由各仓 package.json 决定；无 SDK：materialize_sdk: false；无 test：run_tests: false。
# AI PR review 默认 skip_ai_review: true（非 merge 门禁；试点仓显式 false + AI_REVIEW_LLM_TOKEN）。
# sync-default-branch 须用独立 workflow（templates/sync-default-branch.yml），勿并入本门面。
#
# 嵌套 reusable workflow 须全路径 @actions/vX.Y.Z（跨仓时 $/ 会被解析成 caller 的 ./，见 docs/actions-releases.md）。composite action 仍可用 $/
on:
  workflow_call:
    inputs:
      materialize_sdk:
        description: 是否从 GitHub Packages 物化 framework_sdk_worker
        type: boolean
        default: true
      run_tests:
        description: 是否执行 npm test
        type: boolean
        default: true
      sync_packages_lock:
        description: push dev_* 与同仓 PR 上是否由 CI sync-lock 按 package.json heal 并提交 package-lock（bump 可不含 lock）
        type: boolean
        default: true
      verify_on_push:
        description: "true：push 到 dev_* 也跑 verify（旧快反馈）；默认 false，verify 仅在 Release PR 上作门禁"
        type: boolean
        default: false
      promote:
        description: verify 内是否 FF master（Release PR 仓须 false）
        type: boolean
        default: false
      ai_review_config:
        description: 仓内 AI review 配置 JSON 路径
        type: string
        default: ".ai-review/config.json"
      skip_ai_review:
        description: "true 跳过自建 AI PR review（默认 true；非 merge 门禁）"
        type: boolean
        default: true
      skip_branch_deleted_check:
        description: "已废弃：分支删除事件始终跳过建 PR（deleted head 无法 gh pr create）；保留 input 兼容旧 caller"
        type: boolean
        default: false
      require_non_draft_pr:
        description: "true：auto-merge 要求 PR 非 draft（默认 true）"
        type: boolean
        default: true
      create_draft_release_pr:
        description: "true：ensure-release-pr 新建 draft PR；false（默认）：创建即 ready"
        type: boolean
        default: false
      qodana_throttle_minutes:
        description: "Qodana 同一 PR 全量扫描最小间隔（分钟）；0=禁用限频"
        type: number
        default: 30
      qodana_code_paths:
        description: "覆盖 Qodana 业务代码路径 filter（每行 glob，空=内置默认）"
        type: string
        default: ""
      bot:
        description: "写操作凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App，须配 RELEASE_BOT_*，见 docs/github-app-token-migration.md）。promote 嵌套链暂不受此开关影响"
        type: string
        default: "pat"
    secrets:
      GHA_TOKEN:
        description: 读 Packages / 建 PR / merge / sync-lock 等写操作的 PAT；未传时部分 leaf 回退 GITHUB_TOKEN
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false
      QODANA_TOKEN:
        description: JetBrains Qodana token（Org 未配置时为空，gate 会 skip 扫描）
        required: false
      AI_REVIEW_LLM_TOKEN:
        description: 自建 AI PR review LLM API Key（skip_ai_review=true 时可不传）
        required: false
      AI_REVIEW_LLM_URL:
        description: LLM endpoint URL（推荐 Org Variable；Secret 兼容）
        required: false
      AI_REVIEW_LLM_MODEL:
        description: LLM model（推荐 Org Variable；Secret 兼容）
        required: false
      AI_REVIEW_LLM_EXTRA_HEADERS:
        description: 额外 LLM 请求头（推荐 Org Variable；Secret 兼容）
        required: false
      NOTIFY_GHA_TOKEN:
        description: 与 notify-worker NOTIFY_GHA_TOKEN 同值（Org Secret）；未配置时 notify-blocked Guard 报错
        required: false

# 顶层兜底最小权限；各 job 自行显式声明
permissions: {}

# Release PR 与 destin push 分池 cancel，避免 push 噪声 cancel 已在排队的 PR run（#213）。
# 二者仍共享 grokbot-box 槽位；降 enqueue（push admission）+ 托管 runner 分流才是主 ROI。
concurrency:
  group: >-
    worker-ci-${{ github.repository }}-${{
      github.event_name == 'pull_request' &&
      format('release-pr-{0}', github.event.pull_request.number) ||
      format('destin-push-{0}', github.ref_name)
    }}
  cancel-in-progress: true

jobs:
  # Release PR 公共过滤（GHA 不支持 YAML anchor 跨 job if，以下须保持一致）：
  #   needs.pure-destin-gate.outputs.release_track == 'true'（^dev_[0-9]+_[0-9]+_[0-9]+$，排除 *_pgreq*_verify 等后缀轨）
  #   && event_name==pull_request && action in opened|synchronize|reopened|ready_for_review
  #   && base_ref==master && same-repo
  # 调整触发范围时请同步改：qodana / ai-pr-review / release-auto-merge / notify-blocked / ci-summary
  # push 上 ensure-release-pr 使用相同 release_track；push verify/sync-lock 仍接受任意 dev_* 前缀。
  pure-destin-gate:
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1
    permissions: {}
    outputs:
      release_track: ${{ steps.check.outputs.release_track }}
    steps:
      - name: Classify branch as pure destin release track
        id: check
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          # Keep in sync with tools/lib/pure-destin-branch.mjs.
          # GHA expressions have no matches(); bash =~ is the supported pure-destin gate.
          if [[ "${BRANCH}" =~ ^dev_[0-9]+_[0-9]+_[0-9]+$ ]]; then
            echo "release_track=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_track=false" >> "$GITHUB_OUTPUT"
          fi

  # push dev_*：仅 lock / workflow pin / docs 等噪声路径时跳过 worker-verify（不占 grokbot-box）。
  push-admission:
    needs: [pure-destin-gate]
    if: |
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'dev_')
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      skip_packages_jobs: ${{ steps.admit.outputs.skip_packages_jobs }}
    steps:
      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@actions/v0.2.48
        with:
          fetch-depth: 0
          persist-credentials: "false"
      - name: Classify push diff (noise vs packages jobs)
        id: admit
        uses: workers-world/worker-actions/.github/actions/push-ci-admission@actions/v0.2.48

  # workflow-lint：仅 PR；push 不跑。拿不到路径时 PR 上跑一次（避免 paths-filter 再花 1 分钟）。
  workflow-lint:
    needs: [pure-destin-gate]
    if: |
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: write
    uses: workers-world/worker-actions/.github/workflows/worker-workflow-lint.yml@actions/v0.2.48
    with:
      runner: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
      zizmor_baseline_repository: workers-world/worker-actions
      zizmor_baseline_ref: actions/v0.2.34

  verify:
    needs: [pure-destin-gate, push-admission]
    # push：仅 sync-lock（非 bot）+ 可选 verify_on_push；PR：全量门禁
    # bot synchronize：sync-lock 提交 lock 后 PR 须重跑 verify；lock 漂移时 lock-precheck fail，不得 auto-merge
    # push admission：lock-only / workflow pin / docs-only 跳过 sync-lock（#213）
    # always(): PR 上 push-admission 为 skipped 时，GHA 默认会跳过 needs 依赖 job；须显式继续
    if: |
      always() &&
      !cancelled() &&
      needs.pure-destin-gate.result == 'success' &&
      (needs.push-admission.result == 'success' || needs.push-admission.result == 'skipped') &&
      (
        github.actor != 'github-actions[bot]' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize'
        )
      ) &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref_name, 'dev_') &&
          (inputs.verify_on_push || inputs.sync_packages_lock) &&
          (
            needs.push-admission.result == 'skipped' ||
            needs.push-admission.outputs.skip_packages_jobs != 'true'
          )
        )
      )
    permissions:
      contents: write
      packages: read
      actions: write
    uses: workers-world/worker-actions/.github/workflows/worker-verify.yml@actions/v0.2.48
    # 最小 secret 集：GHA_TOKEN 读 Packages；RELEASE_BOT_* 仅 bot=app 时由 sync-lock 消费
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    with:
      materialize_sdk: ${{ inputs.materialize_sdk }}
      run_tests: ${{ inputs.run_tests }}
      sync_packages_lock: ${{ inputs.sync_packages_lock }}
      run_verify: ${{ github.event_name == 'pull_request' || inputs.verify_on_push }}
      promote: ${{ inputs.promote }}
      bot: ${{ inputs.bot }}

  ensure-release-pr:
    needs: [pure-destin-gate, workflow-lint, verify]
    # push 上须等 verify 内 sync-lock 完成再开 Release PR，避免 lock-precheck 与 heal 竞态（#132）。
    # push 上 lint 常 skipped；bot（lock）不建/不刷 PR
    if: |
      always() &&
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'push' &&
      github.event.deleted != true
    # PAT 建 PR（GHA_TOKEN）；勿给 GITHUB_TOKEN 写权限
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-ensure-release-pr.yml@actions/v0.2.48
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    with:
      release_branch: ${{ github.ref_name }}
      create_draft_release_pr: ${{ inputs.create_draft_release_pr }}
      bot: ${{ inputs.bot }}

  qodana:
    needs: [pure-destin-gate]
    # Org 未启用则 job 级不启动（勿 checkout 后 gate skip）；auto-merge 将 skipped 当通过
    if: |
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      github.actor != 'github-actions[bot]' &&
      (
        contains(fromJSON('["true","1","yes","True","TRUE","Yes","YES"]'), vars.QODANA_ENABLED) ||
        contains(fromJSON('["true","1","yes","True","TRUE","Yes","YES"]'), vars.WORKERS_WORLD_QODANA_ENABLED)
      ) &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # nested worker-qodana-scan 需 actions: write（qodana-scan-gate PR 限频 cache）
      actions: write
    uses: workers-world/worker-actions/.github/workflows/worker-qodana-scan.yml@actions/v0.2.48
    # 最小 secret 集：qodana 只需 QODANA_TOKEN（Org 未配置时为空，由 gate skip，不报错）
    secrets:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      throttle_minutes: ${{ inputs.qodana_throttle_minutes }}
      code_paths: ${{ inputs.qodana_code_paths }}
      pr_action: ${{ github.event.action }}
      base_ref: ${{ github.base_ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  ai-pr-review:
    needs: [pure-destin-gate, workflow-lint]
    if: |
      always() &&
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      inputs.skip_ai_review != true &&
      (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: workers-world/worker-actions/.github/workflows/ai-pr-review.yml@actions/v0.2.48
    secrets:
      AI_REVIEW_LLM_TOKEN: ${{ secrets.AI_REVIEW_LLM_TOKEN }}
      AI_REVIEW_LLM_URL: ${{ secrets.AI_REVIEW_LLM_URL }}
      AI_REVIEW_LLM_MODEL: ${{ secrets.AI_REVIEW_LLM_MODEL }}
      AI_REVIEW_LLM_EXTRA_HEADERS: ${{ secrets.AI_REVIEW_LLM_EXTRA_HEADERS }}
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
    with:
      skip: false
      config_path: ${{ inputs.ai_review_config }}
      actions_bundle_ref: actions/v0.2.39

  release-auto-merge:
    needs: [pure-destin-gate, workflow-lint, verify, qodana]
    if: |
      always() &&
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (inputs.require_non_draft_pr != true || github.event.pull_request.draft == false) &&
      needs.verify.result == 'success' &&
      (needs.qodana.result == 'success' || needs.qodana.result == 'skipped')
    # merge 凭证走 PAT（GHA_TOKEN）或 App（bot=app）；勿给 GITHUB_TOKEN 写权限
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-release-auto-merge.yml@actions/v0.2.48
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      bot: ${{ inputs.bot }}

  ci-failure-comment:
    needs: [pure-destin-gate, workflow-lint, verify, qodana]
    if: |
      always() &&
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        needs.workflow-lint.result == 'failure' ||
        needs.verify.result == 'failure' ||
        needs.qodana.result == 'failure'
      )
    permissions:
      pull-requests: write
    uses: workers-world/worker-actions/.github/workflows/worker-ci-failure-comment.yml@actions/v0.2.48
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}
      workflow_lint_result: ${{ needs.workflow-lint.result }}
      verify_result: ${{ needs.verify.result }}
      qodana_result: ${{ needs.qodana.result }}

  notify-blocked:
    needs: [pure-destin-gate, workflow-lint, verify, qodana, release-auto-merge]
    # reusable workflow 的 job 权限不能超过 caller；被调 notify 需要 actions/checks: read 拉 annotations
    permissions:
      actions: read
      checks: read
      pull-requests: read
    if: |
      always() &&
      needs.pure-destin-gate.outputs.release_track == 'true' &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.release-auto-merge.result != 'success' &&
      needs.release-auto-merge.result != 'cancelled' &&
      needs.verify.result != 'cancelled' &&
      needs.qodana.result != 'cancelled' &&
      needs.workflow-lint.result != 'cancelled' &&
      (
        needs.workflow-lint.result == 'failure' ||
        needs.verify.result == 'failure' ||
        needs.qodana.result == 'failure' ||
        needs.release-auto-merge.result == 'failure' ||
        (
          needs.release-auto-merge.result == 'skipped' &&
          (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped') &&
          needs.verify.result == 'success' &&
          (needs.qodana.result == 'success' || needs.qodana.result == 'skipped')
        )
      )
    uses: workers-world/worker-actions/.github/workflows/worker-notify-release-pr-blocked.yml@actions/v0.2.48
    # 最小 secret 集：发信走 NOTIFY_*；GHA_TOKEN 跨仓拉取 annotation helper（公开仓可空）
    secrets:
      NOTIFY_GHA_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}
      pr_url: ${{ github.event.pull_request.html_url }}
      verify_result: ${{ needs.verify.result }}
      qodana_result: ${{ needs.qodana.result }}
      merge_result: ${{ needs.release-auto-merge.result }}
      actions_bundle_ref: actions/v0.2.34

  # 仪器：进来多少 job、哪些 skipped、估算 hosted 分钟下界（文章「Claude 的眼睛」）
  ci-summary:
    needs: [pure-destin-gate, push-admission, workflow-lint, verify, ensure-release-pr, qodana, ai-pr-review, release-auto-merge]
    if: always()
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Write CI cost summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SKIP_AI_REVIEW: ${{ inputs.skip_ai_review }}
          VERIFY_ON_PUSH: ${{ inputs.verify_on_push }}
          CREATE_DRAFT: ${{ inputs.create_draft_release_pr }}
          LINT_R: ${{ needs.workflow-lint.result }}
          VERIFY_R: ${{ needs.verify.result }}
          ENSURE_R: ${{ needs.ensure-release-pr.result }}
          QODANA_R: ${{ needs.qodana.result }}
          AI_REVIEW_R: ${{ needs.ai-pr-review.result }}
          MERGE_R: ${{ needs.release-auto-merge.result }}
          QODANA_VAR: ${{ vars.QODANA_ENABLED }}
          QODANA_VAR_WW: ${{ vars.WORKERS_WORLD_QODANA_ENABLED }}
        run: |
          set -euo pipefail
          # skipped / cancelled 不占 hosted 分钟；其余约 ≥1 计费分钟/job
          ran=0
          for r in "$LINT_R" "$VERIFY_R" "$ENSURE_R" "$QODANA_R" "$AI_REVIEW_R" "$MERGE_R"; do
            case "$r" in
              success|failure) ran=$((ran + 1)) ;;
            esac
          done
          # 本 summary job 自身也会计 1 分钟
          ran=$((ran + 1))
          {
            echo "## worker-ci cost summary"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| event | \`${EVENT_NAME}\` |"
            echo "| actor | \`${ACTOR}\` |"
            echo "| ref | \`${REF_NAME}\` / head \`${HEAD_REF}\` |"
            echo "| draft | \`${IS_DRAFT}\` |"
            echo "| skip_ai_review | \`${SKIP_AI_REVIEW}\` |"
            echo "| verify_on_push | \`${VERIFY_ON_PUSH}\` |"
            echo "| create_draft_release_pr | \`${CREATE_DRAFT}\` |"
            echo "| QODANA_ENABLED | \`${QODANA_VAR:-}\` / WW \`${QODANA_VAR_WW:-}\` |"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| workflow-lint | \`${LINT_R}\` |"
            echo "| verify | \`${VERIFY_R}\` |"
            echo "| ensure-release-pr | \`${ENSURE_R}\` |"
            echo "| qodana | \`${QODANA_R}\` |"
            echo "| ai-pr-review | \`${AI_REVIEW_R}\` |"
            echo "| release-auto-merge | \`${MERGE_R}\` |"
            echo ""
            echo "**估算启动过的 hosted job 数（含本 summary）≈ ${ran}**（≈ GitHub Linux 计费分钟下界；短 job 按 1 分钟取整）。"
            echo ""
            echo "skip 含义：lint/push 默认不上；qodana 需 Org Variable；ai-pr-review 需 \`skip_ai_review: false\` + LLM token；bot push 整段跳过；draft 不 merge。AI review 失败不阻断 merge。"
          } >> "$GITHUB_STEP_SUMMARY"
