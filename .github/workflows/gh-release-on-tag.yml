name: Create GitHub Release

# actions/v* tag push → GitHub Release 页面（与 release-actions-bundle 解耦）。
# 见 docs/gh-release.md
on:
  push:
    tags:
      - "actions/v*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/create-gh-release.yml
    secrets: inherit
    with:
      tag_name: ${{ github.ref_name }}
