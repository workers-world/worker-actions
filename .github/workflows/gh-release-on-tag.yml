name: Create GitHub Release

# actions/v* tag push → GitHub Release 页面（与 release-actions-bundle 解耦）。
# 见 docs/gh-release.md
on:
  push:
    tags:
      - "actions/v*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/create-gh-release.yml
    # 不传 secrets：create-gh-release 内 GHA_TOKEN 为空时回退 github.token；
    # 本仓 tag 由 release-actions-bundle（GITHUB_TOKEN）打出，无跨仓需求，避免 inherit 过度暴露
    with:
      tag_name: ${{ github.ref_name }}
