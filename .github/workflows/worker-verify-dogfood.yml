name: Worker verify (dogfood)

# 本地 package.json 可继续 file:../framework_sdk_worker；
# CI 从 GitHub Packages 物化同路径，避免 git clone + build SDK。
#
# Caller 典型用法（sync-lock 已内置；promote 默认 false，日常走 Release PR）：
#   permissions: { contents: write, packages: read }  # promote=true 时 contents 可降为 {}（写走 PAT）
# 本仓 dogfood：ci-verify-dogfood 用 $/ 调用本 workflow；sync-lock 为 runs-on job（勿再嵌套 workflow_call，否则 startup_failure）。
#   uses: workers-world/worker-actions/.github/workflows/worker-verify.yml@actions/v0.2.49
#   with:
#     sync_packages_lock: true   # push dev_* 时按 package.json 刷新 lock 并提交
#     run_verify: true           # false：仅 sync-lock（push 默认；门禁在 PR）
#
# PR verify checkout PR head SHA（非 pull/N/merge），与 qodana 一致，避免 stale merge ref 导致 npm ci 失败。
# sync-lock 与 verify 编排（#132：bump 可仅改 package.json，lock 由 CI heal）：
#   push dev_* / 同仓 pull_request：sync-lock job 内 heal 后同 runner 跑 npm ci --dry-run 门禁（#221 Axis B）。
#   bot lock push 仍 synchronize PR；Node **24** 字面量（与 Cloudflare Builds 对齐）。
# 无 SDK（materialize_sdk: false）时不因 lock 未同步跳过 verify（与旧 wait 行为一致）。
# SDK 版本唯一来源：caller 仓 package.json 的 framework_sdk_worker（npm:@workers-world/...@X.Y.Z）。
# promote 默认 false：合入 master 走 ensure-release-pr + OCR 门禁 + release-auto-merge。
# 仅遗留/应急仓设 promote: true（经 worker-promote：开 PR → gh pr merge，禁止直推 master）。
# 无 framework_sdk_worker 的仓（如 manim-playground）：materialize_sdk: false；无 npm test 时 run_tests: false。
#
# 鉴权（403 read_package 时按序检查）：
# 1. Org/仓 Secret GHA_TOKEN（PAT：read:packages，推荐）
# 2. 或 Package「Manage Actions access」授权调用方仓库 + caller permissions.packages:read
on:
  workflow_call:
    inputs:
      node_version:
        description: "已废弃（忽略）；CI 固定 Node 24，与 Cloudflare Builds 对齐"
        type: string
        default: "24"
      promote:
        description: push 到 dev_* 且 verify 绿时，经 Release PR merge 到 master（禁止直推；日常 Release PR 仓须 false）
        type: boolean
        default: false
      master_branch:
        description: 目标主干分支名
        type: string
        default: "master"
      sync_packages_lock:
        description: push dev_* 与同仓 PR 上按 package.json 刷新 package-lock（CI heal；须 GHA_TOKEN read:packages）并 bot 提交
        type: boolean
        default: false
      materialize_sdk:
        description: 是否从 GitHub Packages 物化 framework_sdk_worker（无 SDK 依赖的仓设 false）
        type: boolean
        default: true
      run_tests:
        description: 是否执行 npm test（无 test 脚本的仓设 false）
        type: boolean
        default: true
      run_verify:
        description: "是否跑 npm ci/check/test（默认 true）。false 时仍可跑 sync-lock（push 只刷 lock、门禁留在 PR）"
        type: boolean
        default: true
      bot:
        description: "sync-lock git push 凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App，须配 RELEASE_BOT_*）。npm 认证不走 App（无 packages:read）；promote 嵌套链暂走 PAT"
        type: string
        default: "pat"
      working_directory:
        description: "含 package.json / package-lock.json 的目录（默认仓库根；dogfood / 子项目用）"
        type: string
        default: "."
    secrets:
      GHA_TOKEN:
        description: 读 Packages / 写 master 的 PAT；未传则尝试 GITHUB_TOKEN
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时透传给 sync-lock；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退）
        required: false

# Caller 须授予至少 packages:read；promote 写 master 走 PAT（permissions 可保持 packages:read）
permissions:
  contents: write
  packages: read

jobs:
  sync-lock:
    if: >
      (
        inputs.sync_packages_lock &&
        (
          (
            github.event_name == 'push' &&
            startsWith(github.ref_name, 'dev_')
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      ) ||
      inputs.run_verify
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    outputs:
      in_sync: ${{ steps.export_lock_status.outputs.in_sync }}
      skip: ${{ steps.export_lock_status.outputs.skip }}
    env:
      SYNC_LOCK_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      HEAL_LOCK: ${{ inputs.sync_packages_lock && ((github.event_name == 'push' && startsWith(github.ref_name, 'dev_')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    steps:
      - name: Mint GitHub App token
        id: bot-token
        if: env.HEAL_LOCK == 'true' && inputs.bot == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        with:
          fetch-depth: ${{ env.HEAL_LOCK == 'true' && '0' || '1' }}
          ref: ${{ github.event_name == 'pull_request' && (env.HEAL_LOCK == 'true' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.event.pull_request.head.sha) || github.ref }}
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        id: lock_check
        if: env.HEAL_LOCK == 'true'
        with:
          working-directory: ${{ inputs.working_directory }}
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          skip_dry_run: "true"

      - name: Lock already in sync
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync == 'true' && steps.lock_check.outputs.skip != 'true'
        run: echo "lock 已与 package.json 同步，跳过刷新"

      - name: Regenerate package-lock.json from GitHub Packages
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! grep -q 'framework_sdk_worker' package.json; then
            echo "package.json 无 framework_sdk_worker，跳过"
            exit 0
          fi

          git fetch origin "${SYNC_LOCK_BRANCH}"
          git pull --ff-only origin "${SYNC_LOCK_BRANCH}"

          WANT_VER="$(node -e '
            const s = require("./package.json").dependencies?.framework_sdk_worker || "";
            const m = String(s).match(/@([0-9]+\.[0-9]+\.[0-9]+)/);
            if (!m) {
              console.error("package.json 中 framework_sdk_worker 须为 npm:@workers-world/framework_sdk_worker@X.Y.Z");
              process.exit(1);
            }
            process.stdout.write(m[1]);
          ')"

          lock_matches_version() {
            [[ -f package-lock.json ]] \
              && grep -q 'npm.pkg.github.com' package-lock.json \
              && ! grep -q '"\.\./framework_sdk_worker"' package-lock.json \
              && grep -q "framework_sdk_worker/${WANT_VER}/" package-lock.json
          }

          root_deps_in_sync() {
            [[ -f package-lock.json ]] || return 1
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              const root = lock.packages?.[""] || {};
              function same(a, b) {
                const aa = a || {};
                const bb = b || {};
                const keys = new Set([...Object.keys(aa), ...Object.keys(bb)]);
                for (const k of keys) {
                  if (String(aa[k] ?? "") !== String(bb[k] ?? "")) process.exit(1);
                }
              }
              same(pkg.dependencies, root.dependencies);
              same(pkg.devDependencies, root.devDependencies);
            '
          }

          if [[ ! -f .npmrc ]] || ! grep -q 'npm.pkg.github.com' .npmrc; then
            {
              echo '@workers-world:registry=https://npm.pkg.github.com'
              echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
            } >> .npmrc
          fi
          rm -rf node_modules/framework_sdk_worker
          if [[ -f package-lock.json ]] && grep -q '"\.\./framework_sdk_worker"' package-lock.json; then
            echo "移除 file: link 残留 lock，重新生成"
            rm -f package-lock.json
          fi
          NPM_COMMON_ARGS=(--no-fund --no-audit)
          if [ "${{ steps.lock_check.outputs.legacy_peer_deps }}" = "true" ]; then
            NPM_COMMON_ARGS+=(--legacy-peer-deps)
            echo "caller 启用 legacy-peer-deps，npm install/ci 将带上 --legacy-peer-deps"
          else
            echo "caller 未启用 legacy-peer-deps，npm install/ci 写入/校验完整 peer 依赖树"
          fi
          echo "按 package.json 全量刷新 lock → framework_sdk_worker@${WANT_VER}"
          npm install "${NPM_COMMON_ARGS[@]}"
          echo "push sync-lock 不跑 npm ci（网络/自托管）；干净 npm ci 仅在 PR 门禁（与 Cloudflare Builds 对齐）"
          rm -rf node_modules
          if ! lock_matches_version; then
            echo "::error::package-lock 未解析到 @workers-world/framework_sdk_worker@${WANT_VER}。请确认 Packages 已发布且 GHA_TOKEN/read 权限正常。"
            exit 1
          fi
          if ! root_deps_in_sync; then
            echo "::error::刷新后 package-lock 根依赖仍与 package.json 不一致。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .npmrc
          if git diff --cached --quiet; then
            echo "package-lock 与 remote 一致，无需提交"
            exit 0
          fi
          git commit -m "CI action 自动刷新 package-lock（GitHub Packages SDK ${WANT_VER}）" -m "供 Cloudflare Builds npm ci 安装；含 package.json 根依赖同步。"

          push_with_rebase() {
            git fetch origin "${SYNC_LOCK_BRANCH}"
            git pull --rebase origin "${SYNC_LOCK_BRANCH}"
            git push origin "HEAD:${SYNC_LOCK_BRANCH}"
          }

          if push_with_rebase; then
            exit 0
          fi
          echo "push 被拒，rebase 后重试一次…"
          push_with_rebase

      - uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        id: lock_gate
        if: inputs.run_verify
        with:
          working-directory: ${{ inputs.working_directory }}
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fail PR gate when package-lock out of sync
        if: >
          inputs.run_verify &&
          github.event_name == 'pull_request' &&
          inputs.sync_packages_lock &&
          inputs.materialize_sdk &&
          steps.lock_gate.outputs.skip != 'true' &&
          steps.lock_gate.outputs.in_sync != 'true'
        run: |
          echo "::error::PR 门禁：package-lock 与 package.json 仍不同步，或 npm ci --dry-run 失败（sync-lock heal 未成功）。"
          echo "bump 可仅改 package.json；须配置 Org Secret GHA_TOKEN（read:packages）并确认 sync-lock job 已成功 push lock。"
          echo "勿依赖本地 npm install（开发者网络常无法访问 GitHub Packages）。"
          exit 1

      - name: Export lock job outputs
        id: export_lock_status
        if: always()
        run: |
          set -euo pipefail
          in_sync="${{ steps.lock_gate.outputs.in_sync }}"
          skip="${{ steps.lock_gate.outputs.skip }}"
          if [ -z "$in_sync" ]; then
            in_sync=true
            skip=true
          fi
          echo "in_sync=${in_sync}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  verify:
    needs: sync-lock
    if: >
      always() &&
      inputs.run_verify &&
      (needs.sync-lock.result == 'success' || needs.sync-lock.result == 'skipped') &&
      (
        needs.sync-lock.result == 'skipped' ||
        needs.sync-lock.outputs.skip == 'true' ||
        needs.sync-lock.outputs.in_sync == 'true' ||
        !(inputs.sync_packages_lock && inputs.materialize_sdk)
      )
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      SYNC_LOCK_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Pull lock commit from sync-lock job
        if: needs.sync-lock.result == 'success'
        run: git pull --ff-only origin "${SYNC_LOCK_BRANCH}"

      - name: Detect npm verify scope
        id: npm_scope
        shell: bash
        run: |
          set -euo pipefail
          pkg="package.json"
          lock="package-lock.json"
          if [ ! -f "$pkg" ]; then
            echo "::notice::无 package.json，跳过 npm verify（container / 纯 Python 等仓）"
            echo "run_npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$lock" ] && [ "${{ inputs.materialize_sdk }}" != "true" ]; then
            echo "::notice::无 package-lock.json 且 materialize_sdk=false，跳过 npm verify"
            echo "run_npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_npm=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7.1.0
        if: steps.npm_scope.outputs.run_npm == 'true'
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}

      - name: Restore node_modules cache
        if: steps.npm_scope.outputs.run_npm == 'true'
        uses: actions/cache/restore@v6
        id: node_modules_cache
        with:
          path: ${{ inputs.working_directory == '.' && 'node_modules' || format('{0}/node_modules', inputs.working_directory) }}
          key: verify-deps-v1-${{ runner.os }}-node24-lock-${{ inputs.working_directory == '.' && hashFiles('package-lock.json') || hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}

      - name: Materialize SDK from GitHub Packages
        if: steps.npm_scope.outputs.run_npm == 'true' && inputs.materialize_sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_GHA_TOKEN: ${{ secrets.GHA_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_GHA_TOKEN}" != "true" ]; then
            echo "::warning::未配置 GHA_TOKEN，改用 GITHUB_TOKEN。跨仓读 Packages 常 403；请设 Org Secret GHA_TOKEN（read:packages），或在包设置里给本仓开 Actions read。"
          fi
          SDK_SPEC="$(node -e '
            const dep = require("./package.json").dependencies?.framework_sdk_worker || "";
            const fromPkg = dep.startsWith("npm:") ? dep.slice(4) : dep;
            if (!/^@workers-world\/framework_sdk_worker@[0-9]+\.[0-9]+\.[0-9]+$/.test(fromPkg)) {
              console.error("package.json framework_sdk_worker 须为 npm:@workers-world/framework_sdk_worker@X.Y.Z，当前:", dep);
              process.exit(1);
            }
            process.stdout.write(fromPkg);
          ')"
          pack_dir="$(mktemp -d)"
          sdk_dir="${GITHUB_WORKSPACE}/../framework_sdk_worker"
          mkdir -p "$sdk_dir"
          if ! (
            cd "$pack_dir"
            npm pack "${SDK_SPEC}"
          ); then
            echo "::error::npm pack ${SDK_SPEC} 失败（多为 403 read_package）。修复：1) Org Secrets 增加 GHA_TOKEN（classic PAT: read:packages）；2) github.com/orgs/workers-world/packages → framework_sdk_worker → Package settings → Manage Actions access → 添加本仓库 Read。"
            exit 1
          fi
          tar -xzf "$pack_dir"/*.tgz -C "$sdk_dir" --strip-components=1
          test -f "$sdk_dir/package.json"
          test -d "$sdk_dir/dist"
          # 已发布包 files 仅含 dist，无 scripts/；若 package.json 仍有 prepare，
          # 而 Worker lock 还是 link:../framework_sdk_worker，npm ci 会跑钩子并失败。
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            if (j.scripts) {
              delete j.scripts.prepare;
              delete j.scripts.prepublishOnly;
              delete j.scripts.prepublish;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$sdk_dir/package.json"
          echo "SDK materialized at $sdk_dir ($(node -p "require('$sdk_dir/package.json').version"))"

      # lock 为 file:../ 时 npm ci 走物化目录，不访问 Packages；sync-lock 后 lock 指向
      # npm.pkg.github.com，此处必须带 NODE_AUTH_TOKEN（.npmrc 用 ${NODE_AUTH_TOKEN}）。
      # node_modules 缓存命中时用 npm ci --prefer-offline（仍校验 lock，不跳过 dry-run 级完整性）；
      # lock 变更时 cache key 变，自动全量 npm ci。不替代 sync-lock job 内 npm ci --dry-run 门禁。
      - name: Run npm ci
        if: steps.npm_scope.outputs.run_npm == 'true'
        run: |
          set -euo pipefail
          common=(--no-fund --no-audit)
          if [ "${{ steps.node_modules_cache.outputs.cache-hit }}" = "true" ]; then
            npm ci --prefer-offline "${common[@]}"
          else
            npm ci "${common[@]}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: steps.npm_scope.outputs.run_npm == 'true' && steps.node_modules_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.working_directory == '.' && 'node_modules' || format('{0}/node_modules', inputs.working_directory) }}
          key: verify-deps-v1-${{ runner.os }}-node24-lock-${{ inputs.working_directory == '.' && hashFiles('package-lock.json') || hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}
      - name: npm run check
        if: steps.npm_scope.outputs.run_npm == 'true'
        run: npm run check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
      - name: npm test
        if: steps.npm_scope.outputs.run_npm == 'true' && inputs.run_tests
        run: npm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

  # dogfood 不嵌套 worker-promote（reusable→reusable→reusable 会 startup_failure）；promote 见 worker-verify.yml
