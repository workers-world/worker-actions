name: Release actions bundle

# 合入 master（且变更触及可复用 workflow/action 或版本号）后自动打不可变 tag actions/vX.Y.Z。
# 版本权威 = package.json version（对齐 SDK：本地 bump 才发版，未 bump 跳过）。
# 也可 workflow_dispatch 指定版本。Worker 仓 pin 该 tag，勿再用 @master。
# 打 tag 前在 release 分支对齐内层 @actions/v* pin；manifest 经 PR 回填 destin（default dev_*，禁止直推）。见 docs/actions-releases.md
# Phase B 鉴权：须 mint release-bot App（RELEASE_BOT_APP_ID = Variable 或 Secret + RELEASE_BOT_PRIVATE_KEY）；见 docs/github-app-token-migration.md
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version:
        description: 可选。留空则读 package.json version；填写如 0.5.0 → tag actions/v0.5.0
        required: false
        type: string
        default: ""

# 写权限仅 tag job 需要；gate 只读 commit subject（zizmor excessive-permissions）
permissions: {}

concurrency:
  group: release-actions-bundle
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      # Need tools/actions-bundle/skip-actions-release.mjs（#294：merge commit 的 skip 在 PR 标题行）
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: tools/actions-bundle
          persist-credentials: false

      - name: Skip gate ([skip actions-release])
        id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Squash：subject=PR 标题；Merge commit：首行为 Merge pull request #N，PR 标题在其后首个非空行。
          # 勿扫描全文——squash 正文常含历史 [skip actions-release]（见 docs/actions-releases.md）。
          # CLI 写 proceed=；exit 0=skip，1=proceed（set +e 接收非 0）。
          set +e
          node tools/actions-bundle/skip-actions-release.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::skip-actions-release.mjs failed with rc=${rc}"
            exit "$rc"
          fi

  tag:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.gate.result == 'success' && needs.gate.outputs.proceed == 'true')
      )
    # secrets 不可用于 step if:（actionlint / GHA context rules）；经 job env 聚合 Variable|Secret
    env:
      RELEASE_BOT_APP_ID_EFFECTIVE: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
    steps:
      # App 通道：RELEASE_BOT_APP_ID 可为 Org Variable **或** Secret（与 leaf workflows /
      # docs/github-app-token-migration.md 一致）。vars-only 的 if 会在 APP_ID 仅存于 Secret 时跳过 mint
      # （见 actions/runs/37625776021），随后静默回落 GHA_TOKEN PAT → Phase B 无 workflow scope 被拒。
      # Phase A tag push 仍可回落 GHA_TOKEN；Phase B 必须使用 mint 出的 App token（workflows:write）。
      - name: Mint GitHub App token
        id: bot-token
        if: env.RELEASE_BOT_APP_ID_EFFECTIVE != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.RELEASE_BOT_APP_ID_EFFECTIVE }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ensure-gh-cli

      - name: Resolve version, align pins, create tag, open backfill PR
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # Phase A tag push 与 Phase B 均须 App token（tag 树含 .github/workflows pin 对齐）。
          # 禁止回落 GHA_TOKEN/GITHUB_TOKEN——
          # PAT 无 workflow scope 时会静默失败（run 37625776021）。
          # checkout 的 App/PAT 会写 includeIf.gitdir → Phase B 须先清本地 cred 再 set-url。
          RELEASE_GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          WORKFLOW_PUSH_GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git_push_auth() {
            local token="$1"
            shift
            git -c "http.extraHeader=AUTHORIZATION: bearer ${token}" push "$@"
          }

          # checkout 的 token（App/PAT）会写入 origin URL、http.extraHeader 与 includeIf.gitdir；
          # push 前须清干净再 set-url 为 WORKFLOW_PUSH_GH_TOKEN（release-bot App，workflows:write）。
          git_push_phase_b() {
            # checkout (App/PAT) leaves local extraHeader + includeIf.gitdir:/… → temp creds; PAT then blocks .github/workflows/**
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
            # git config --name-only 在 Linux 上会把 includeIf 规范为 includeif；须 -i 且匹配 gitdir: 而非 gitdir.
            include_if_keys="$(git config --local --name-only -l 2>/dev/null | grep -i '^includeif\.gitdir' || true)"
            if [ -n "${include_if_keys}" ]; then
              echo "Phase B push: clearing includeIf.gitdir* local config keys:"
              printf '%s\n' "${include_if_keys}" | sed 's/^/  /'
            else
              echo "Phase B push: no includeIf.gitdir* keys in local git config"
            fi
            while IFS= read -r key; do
              [ -n "$key" ] || continue
              git config --local --unset-all "$key" 2>/dev/null || true
            done <<< "${include_if_keys}"
            git config --local --unset-all credential.helper 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_GH_TOKEN}@github.com/${REPO}.git"
            git push "$@"
          }

          # Tag 树须含 workflow/action/template 全部 nested @actions/v* 对齐，否则 caller pin 新 tag 仍解析到旧 leaf。
          # 含 .github/workflows 的 commit/tag push 须 release-bot App（workflows:write），禁止仅 GHA_TOKEN。
          source tools/actions-bundle/nested-pins-lib.sh

          git_push_tag() {
            if [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
              echo "::error::Tag push 含 .github/workflows pin 对齐，须 release-bot App token（workflows:write）。"
              echo "Configure RELEASE_BOT_APP_ID + RELEASE_BOT_PRIVATE_KEY；勿用无 workflow scope 的 PAT。"
              exit 1
            fi
            git_push_phase_b "$@"
          }

          TRIGGER_REF="$(git rev-parse HEAD)"
          # 版本权威 = package.json version（对齐 SDK：本地 bump 才发版；未 bump 跳过，勿再 patch+1）
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "${PKG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version 须为 X.Y.Z，当前: ${PKG_VERSION}"
            exit 1
          fi

          # 当前 commit 已有 tag（例如上次 run 已打 tag、PR 推送失败）→ 只回填 PR，勿重复发版
          existing_on_head="$(git tag -l 'actions/v*' --points-at "$TRIGGER_REF" | sort -t. -k1,1 -k2,2n -k3,3n | tail -1 || true)"
          if [ -n "${INPUT_VERSION}" ]; then
            # workflow_dispatch 指定版本：minor/major 或应急通道
            if ! [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version 须为 X.Y.Z，当前: ${INPUT_VERSION}"
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            TAG="actions/v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::tag 已存在: ${TAG}（workflow_dispatch 指定版本时勿重复）"
              exit 1
            fi
            TAG_CREATED=0
            NEED_TAG=1
            echo "workflow_dispatch specified version: ${VERSION}"
          elif [ -n "${existing_on_head}" ]; then
            TAG="${existing_on_head}"
            VERSION="${TAG#actions/v}"
            TAG_CREATED=0
            NEED_TAG=0
            echo "HEAD already tagged ${TAG}; sync backfill PR only"
          elif git rev-parse "actions/v${PKG_VERSION}" >/dev/null 2>&1; then
            # package.json 未 bump（该版本已发过）→ 跳过发版（对齐 SDK：版本没变不 publish/tag）
            TAG="actions/v${PKG_VERSION}"
            VERSION="${PKG_VERSION}"
            echo "Skip release: ${TAG} already exists; bump package.json version to release"
            {
              echo "### Actions bundle release skipped"
              echo ""
              echo "- package.json version \`${PKG_VERSION}\` 已发布为 \`${TAG}\`，本次合入未 bump 版本号，未打新 tag。"
              echo "- 下次发版：在 Release PR 里 bump \`package.json\` 的 \`version\`（如 \`0.2.66\`）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            VERSION="${PKG_VERSION}"
            TAG="actions/v${VERSION}"
            TAG_CREATED=0
            NEED_TAG=1
            echo "Release version from package.json: ${TAG}"
          fi

          MANIFEST="manifest/actions-bundle.yaml"
          TODAY="$(date -u +%Y-%m-%d)"
          BRANCH="chore/actions-bundle-${VERSION}"
          COMMIT_MSG="chore: release actions bundle ${TAG} — align action/template pins + manifest [skip actions-release]"

          write_manifest() {
            local ref="$1"
            mkdir -p "$(dirname "$MANIFEST")"
            {
              echo "# Actions bundle 当前版本（Worker 仓 pin 此 tag）"
              echo "# 完整变更见 docs/actions-releases.md；权威来源为 git tag"
              echo "current: ${TAG}"
              echo "sha: \"${ref}\""
              echo "released_at: \"${TODAY}\""
              echo "notes: |"
              if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "  Released via workflow_dispatch."
              else
                echo "  Auto-released on push to master (actions paths changed)."
              fi
            } > "$MANIFEST"
          }

          git fetch origin master
          git checkout -B "$BRANCH" origin/master

          if [ "$NEED_TAG" = 1 ] && [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
            echo "::error::新发 tag 须在含 .github/workflows pin 对齐的 commit 上打出，须 release-bot App token。"
            echo "Mint skipped/failed. Configure RELEASE_BOT_APP_ID (Org Variable or Secret) and"
            echo "RELEASE_BOT_PRIVATE_KEY (Org Secret); install workers-world-release-bot on this repo."
            echo "See docs/github-app-token-migration.md."
            exit 1
          fi

          # --- Phase A: align all bundle nested pins (incl. workflows) before tagging ---
          # sha 语义：manifest.sha = annotated tag 的 peel（git rev-list -n 1 TAG）。
          # 单次 commit 无法嵌入自身 object id；旧逻辑用 amend 回写 sha，会把
          # 中间（常未 push、已悬空）SHA 写进 tag 树（见 #195 / WW-451）。
          # 做法：新 tag 时先写 provisional sha → 打 tag → **新 commit** 校正为 peel
          #（不 retag）；tag 已存在时直接写 peel。
          rewrite_nested_pins "${TAG}" "${BUNDLE_PIN_GLOBS[@]}"
          if [ "$NEED_TAG" = 1 ]; then
            write_manifest "$(git rev-parse HEAD)"
          else
            REF="$(git rev-list -n 1 "$TAG" 2>/dev/null || git rev-parse HEAD)"
            write_manifest "$REF"
          fi
          git add "${BUNDLE_PIN_GLOBS[@]}" "$MANIFEST"
          PHASE_A_STAGED=0
          if ! git diff --cached --quiet; then
            PHASE_A_STAGED=1
            git commit -m "${COMMIT_MSG}"
          fi

          if [ "$NEED_TAG" = 1 ]; then
            REF="$(git rev-parse HEAD)"
            git tag -a "$TAG" -m "Actions bundle ${TAG}"
            git_push_tag origin "$TAG"
            TAG_CREATED=1
            echo "Created ${TAG} at ${REF} (tag tree includes workflow + action/template nested pins)"
            write_manifest "$REF"
            git add "$MANIFEST"
            if ! git diff --cached --quiet; then
              git commit -m "chore: record ${TAG} peel sha in manifest [skip actions-release]"
            fi
          else
            if [ "$PHASE_A_STAGED" = 0 ]; then
              echo "Backfill branch manifest/pins already aligned for ${TAG}"
            fi
          fi

          # --- Phase B: backfill PR → destin (default dev_*); idempotent pin pass for drift ---
          if [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
            echo "::error::Phase B needs release-bot App installation token (workflows:write)."
            echo "Mint skipped/failed. Configure RELEASE_BOT_APP_ID (Org Variable or Secret) and"
            echo "RELEASE_BOT_PRIVATE_KEY (Org Secret); install workers-world-release-bot on this repo."
            echo "See docs/github-app-token-migration.md. Refusing GHA_TOKEN fallback (no workflow scope)."
            exit 1
          fi

          DESTIN_BRANCH="$(gh repo view "$REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          echo "Bundle backfill PR base (destin): ${DESTIN_BRANCH}"
          if ! [[ "${DESTIN_BRANCH}" =~ ^dev_ ]]; then
            echo "::warning::Default branch ${DESTIN_BRANCH} is not dev_*; still targeting default branch for backfill"
          fi
          git fetch origin "$DESTIN_BRANCH"
          git checkout -B "$BRANCH" "origin/${DESTIN_BRANCH}"

          rewrite_nested_pins "${TAG}" "${BUNDLE_PIN_GLOBS[@]}"
          REF="$(git rev-list -n 1 "$TAG" 2>/dev/null || git rev-parse HEAD)"
          write_manifest "$REF"
          git add "${BUNDLE_PIN_GLOBS[@]}" "$MANIFEST"
          if ! git diff --cached --quiet; then
            git commit -m "${COMMIT_MSG}"
            echo "Phase B: pins + manifest committed for destin backfill PR"
          else
            echo "Phase B: nested pins and manifest already aligned on ${DESTIN_BRANCH}"
          fi

          if [ "$(git rev-list --count "origin/${DESTIN_BRANCH}"..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            git_push_phase_b -u origin "HEAD:${BRANCH}" --force-with-lease
          fi

          if [ "$(git rev-list --count "origin/${DESTIN_BRANCH}"..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            existing="$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$DESTIN_BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "Backfill PR already open: #${existing} (→ ${DESTIN_BRANCH})"
            else
              gh pr create --repo "$REPO" \
                --base "$DESTIN_BRANCH" \
                --head "$BRANCH" \
                --title "chore: actions bundle ${TAG} (pins + manifest) [skip actions-release]" \
                --body "$(cat <<EOF
          ## Actions bundle backfill

          - Tag: \`${TAG}\`（已存在于远程；tag 树内 workflow/action/template nested pin 与 tag 一致）
          - Tag SHA: \`${REF}\`
          - tag_created_this_run: ${TAG_CREATED}
          - Base branch: \`${DESTIN_BRANCH}\`（destin；**不会**直推 master）

          两阶段发版：tag 在 **已对齐全部 nested pin**（含 \`.github/workflows/**\`）的 commit 上打出（须 release-bot App \`workflows:write\`）；本 PR 将 \`manifest/actions-bundle.yaml\` 与 nested pin 回填 **destin**，再经正常 destin→master Release 单向合入 master。回填分支由 App token push（**非** \`GITHUB_TOKEN\`）。**PR 标题**与 commit subject 含 \`[skip actions-release]\`（squash subject **或** merge commit 的 PR 标题行），不会再打 tag。
          EOF
          )"
              echo "Opened backfill PR for ${TAG} → ${DESTIN_BRANCH}"
            fi
          else
            echo "No diff vs origin/${DESTIN_BRANCH}; skip PR"
          fi

          {
            echo "### Actions bundle released"
            echo ""
            echo "- **Tag**: \`${TAG}\` (created_this_run=${TAG_CREATED})"
            echo "- **SHA**: \`${REF}\`"
            echo "- Worker bump: \`@${TAG}\`"
            echo "- Backfill: PR \`${BRANCH}\` → \`${DESTIN_BRANCH}\`（勿直推 destin/master）"
          } >> "$GITHUB_STEP_SUMMARY"
