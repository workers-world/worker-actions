name: Release actions bundle

# 合入 master（且变更触及可复用 workflow/action）后自动打不可变 tag actions/vX.Y.Z。
# 也可 workflow_dispatch 指定版本。Worker 仓 pin 该 tag，勿再用 @master。
# 打 tag 前在 release 分支对齐内层 @actions/v* pin；manifest 经 PR 回填（master 禁止直推）。见 docs/actions-releases.md
# Phase B 鉴权：须 mint release-bot App（RELEASE_BOT_APP_ID = Variable 或 Secret + RELEASE_BOT_PRIVATE_KEY）；见 docs/github-app-token-migration.md
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      version:
        description: 可选。留空则 patch+1；填写如 0.5.0 → tag actions/v0.1.0
        required: false
        type: string
        default: ""

# 写权限仅 tag job 需要；gate 只读 commit subject（zizmor excessive-permissions）
permissions: {}

concurrency:
  group: release-actions-bundle
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Skip gate ([skip actions-release])
        id: check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Squash-merge：subject = PR 标题（首行）；正文含历史 commit 说明，勿扫描全文
          subject="${MSG%%$'\n'*}"
          if [[ "$subject" == *'[skip actions-release]'* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skip release: commit subject contains [skip actions-release]"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.gate.result == 'success' && needs.gate.outputs.proceed == 'true')
      )
    # secrets 不可用于 step if:（actionlint / GHA context rules）；经 job env 聚合 Variable|Secret
    env:
      RELEASE_BOT_APP_ID_EFFECTIVE: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
    steps:
      # App 通道：RELEASE_BOT_APP_ID 可为 Org Variable **或** Secret（与 leaf workflows /
      # docs/github-app-token-migration.md 一致）。vars-only 的 if 会在 APP_ID 仅存于 Secret 时跳过 mint
      # （见 actions/runs/37625776021），随后静默回落 GHA_TOKEN PAT → Phase B 无 workflow scope 被拒。
      # Phase A tag push 仍可回落 GHA_TOKEN；Phase B 必须使用 mint 出的 App token（workflows:write）。
      - name: Mint GitHub App token
        id: bot-token
        if: env.RELEASE_BOT_APP_ID_EFFECTIVE != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.RELEASE_BOT_APP_ID_EFFECTIVE }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ensure-gh-cli

      - name: Resolve version, align pins, create tag, open backfill PR
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # Phase A tag push 与 Phase B 均须 App token（tag 树含 .github/workflows pin 对齐）。
          # 禁止回落 GHA_TOKEN/GITHUB_TOKEN——
          # PAT 无 workflow scope 时会静默失败（run 37625776021）。
          # checkout 的 App/PAT 会写 includeIf.gitdir → Phase B 须先清本地 cred 再 set-url。
          RELEASE_GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          WORKFLOW_PUSH_GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git_push_auth() {
            local token="$1"
            shift
            git -c "http.extraHeader=AUTHORIZATION: bearer ${token}" push "$@"
          }

          # checkout 的 token（App/PAT）会写入 origin URL、http.extraHeader 与 includeIf.gitdir；
          # push 前须清干净再 set-url 为 WORKFLOW_PUSH_GH_TOKEN（release-bot App，workflows:write）。
          git_push_phase_b() {
            # checkout (App/PAT) leaves local extraHeader + includeIf.gitdir:/… → temp creds; PAT then blocks .github/workflows/**
            git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
            # git config --name-only 在 Linux 上会把 includeIf 规范为 includeif；须 -i 且匹配 gitdir: 而非 gitdir.
            include_if_keys="$(git config --local --name-only -l 2>/dev/null | grep -i '^includeif\.gitdir' || true)"
            if [ -n "${include_if_keys}" ]; then
              echo "Phase B push: clearing includeIf.gitdir* local config keys:"
              printf '%s\n' "${include_if_keys}" | sed 's/^/  /'
            else
              echo "Phase B push: no includeIf.gitdir* keys in local git config"
            fi
            while IFS= read -r key; do
              [ -n "$key" ] || continue
              git config --local --unset-all "$key" 2>/dev/null || true
            done <<< "${include_if_keys}"
            git config --local --unset-all credential.helper 2>/dev/null || true
            git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_GH_TOKEN}@github.com/${REPO}.git"
            git push "$@"
          }

          # Tag 树须含 workflow/action/template 全部 nested @actions/v* 对齐，否则 caller pin 新 tag 仍解析到旧 leaf。
          # 含 .github/workflows 的 commit/tag push 须 release-bot App（workflows:write），禁止仅 GHA_TOKEN。
          BUNDLE_PIN_GLOBS=(.github/actions .github/workflows templates docs/templates)

          rewrite_nested_pins() {
            local target_tag="$1"
            shift
            local globs=("$@")
            local changed=0
            while IFS= read -r -d '' f; do
              if grep -qE '@actions/v[0-9]+\.[0-9]+\.[0-9]+' "$f"; then
                sed -i -E "s|@actions/v[0-9]+\.[0-9]+\.[0-9]+|@${target_tag}|g" "$f"
                changed=1
              fi
            done < <(
              find "${globs[@]}" -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null || true
            )
            if [ "$changed" = 1 ]; then
              echo "Rewrote nested @actions/v* pins → @${target_tag} under: ${globs[*]}"
            else
              echo "No @actions/v* pins to rewrite under: ${globs[*]}"
            fi
          }

          git_push_tag() {
            if [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
              echo "::error::Tag push 含 .github/workflows pin 对齐，须 release-bot App token（workflows:write）。"
              echo "Configure RELEASE_BOT_APP_ID + RELEASE_BOT_PRIVATE_KEY；勿用无 workflow scope 的 PAT。"
              exit 1
            fi
            git_push_phase_b "$@"
          }

          TRIGGER_REF="$(git rev-parse HEAD)"
          # 当前 commit 已有 tag（例如上次 run 已打 tag、PR 推送失败）→ 只回填 PR，勿再 patch+1
          existing_on_head="$(git tag -l 'actions/v*' --points-at "$TRIGGER_REF" | sort -t. -k1,1 -k2,2n -k3,3n | tail -1 || true)"
          if [ -n "${existing_on_head}" ] && [ -z "${INPUT_VERSION}" ]; then
            TAG="${existing_on_head}"
            VERSION="${TAG#actions/v}"
            TAG_CREATED=0
            NEED_TAG=0
            echo "HEAD already tagged ${TAG}; sync backfill PR only"
          else
            latest="$(git tag -l 'actions/v*' --sort=-v:refname | head -1 || true)"
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION}"
            elif [ -n "${latest}" ]; then
              ver="${latest#actions/v}"
              IFS=. read -r maj min pat <<< "${ver}"
              VERSION="${maj}.${min}.$((pat + 1))"
              echo "Auto bump patch: ${latest} → actions/v${VERSION}"
            else
              if [ -f manifest/actions-bundle.yaml ]; then
                cur="$(grep -E '^current:' manifest/actions-bundle.yaml | head -1 | awk '{print $2}' || true)"
                if [[ "${cur}" =~ ^actions/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                  VERSION="${BASH_REMATCH[1]}"
                else
                  VERSION="0.4.0"
                fi
              else
                VERSION="0.4.0"
              fi
              echo "No existing actions/v* tag; using ${VERSION}"
            fi

            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version 须为 X.Y.Z，当前: ${VERSION}"
              exit 1
            fi

            TAG="actions/v${VERSION}"
            TAG_CREATED=0

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              NEED_TAG=0
              echo "Tag ${TAG} already exists at $(git rev-list -n 1 "$TAG")"
              if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
                echo "::error::tag 已存在: ${TAG}（workflow_dispatch 指定版本时勿重复）"
                exit 1
              fi
            else
              NEED_TAG=1
            fi
          fi

          MANIFEST="manifest/actions-bundle.yaml"
          TODAY="$(date -u +%Y-%m-%d)"
          BRANCH="chore/actions-bundle-${VERSION}"
          COMMIT_MSG="chore: release actions bundle ${TAG} — align action/template pins + manifest [skip actions-release]"
          WORKFLOW_COMMIT_MSG="chore: align remaining nested pins for ${TAG} [skip actions-release]"

          write_manifest() {
            local ref="$1"
            mkdir -p "$(dirname "$MANIFEST")"
            {
              echo "# Actions bundle 当前版本（Worker 仓 pin 此 tag）"
              echo "# 完整变更见 docs/actions-releases.md；权威来源为 git tag"
              echo "current: ${TAG}"
              echo "sha: \"${ref}\""
              echo "released_at: \"${TODAY}\""
              echo "notes: |"
              if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "  Released via workflow_dispatch."
              else
                echo "  Auto-released on push to master (actions paths changed)."
              fi
            } > "$MANIFEST"
          }

          git fetch origin master
          git checkout -B "$BRANCH" origin/master

          if [ "$NEED_TAG" = 1 ] && [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
            echo "::error::新发 tag 须在含 .github/workflows pin 对齐的 commit 上打出，须 release-bot App token。"
            echo "Mint skipped/failed. Configure RELEASE_BOT_APP_ID (Org Variable or Secret) and"
            echo "RELEASE_BOT_PRIVATE_KEY (Org Secret); install workers-world-release-bot on this repo."
            echo "See docs/github-app-token-migration.md."
            exit 1
          fi

          # --- Phase A: align all bundle nested pins (incl. workflows) before tagging ---
          rewrite_nested_pins "${TAG}" "${BUNDLE_PIN_GLOBS[@]}"
          git add "${BUNDLE_PIN_GLOBS[@]}"
          PHASE_A_STAGED=0
          if ! git diff --cached --quiet; then
            PHASE_A_STAGED=1
            git commit -m "${COMMIT_MSG}"
          fi

          if [ "$NEED_TAG" = 1 ]; then
            REF="$(git rev-parse HEAD)"
            write_manifest "$REF"
            git add "$MANIFEST"
            if [ "$PHASE_A_STAGED" = 1 ]; then
              git commit --amend --no-edit
            else
              git commit -m "${COMMIT_MSG}"
            fi
            REF="$(git rev-parse HEAD)"
            write_manifest "$REF"
            git add "$MANIFEST"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            REF="$(git rev-parse HEAD)"
            git tag -a "$TAG" -m "Actions bundle ${TAG}"
            git_push_tag origin "$TAG"
            TAG_CREATED=1
            echo "Created ${TAG} at ${REF} (tag tree includes workflow + action/template nested pins)"
          else
            REF="$(git rev-list -n 1 "$TAG" 2>/dev/null || git rev-parse HEAD)"
            write_manifest "$REF"
            git add "$MANIFEST"
            if git diff --cached --quiet && [ "$PHASE_A_STAGED" = 0 ]; then
              echo "Backfill branch manifest/pins already aligned for ${TAG}"
            else
              if [ "$PHASE_A_STAGED" = 1 ]; then
                git commit --amend -m "${COMMIT_MSG}" 2>/dev/null || git commit -m "${COMMIT_MSG}"
              else
                git commit -m "chore: bump actions bundle manifest to ${TAG} [skip actions-release]"
              fi
            fi
          fi

          # --- Phase B: backfill PR push (App token); idempotent pin pass for drift ---
          if [ -z "${WORKFLOW_PUSH_GH_TOKEN}" ]; then
            echo "::error::Phase B needs release-bot App installation token (workflows:write)."
            echo "Mint skipped/failed. Configure RELEASE_BOT_APP_ID (Org Variable or Secret) and"
            echo "RELEASE_BOT_PRIVATE_KEY (Org Secret); install workers-world-release-bot on this repo."
            echo "See docs/github-app-token-migration.md. Refusing GHA_TOKEN fallback (no workflow scope)."
            exit 1
          fi

          rewrite_nested_pins "${TAG}" "${BUNDLE_PIN_GLOBS[@]}"
          git add "${BUNDLE_PIN_GLOBS[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "${WORKFLOW_COMMIT_MSG}"
            echo "Phase B: extra nested pin drift committed for backfill PR"
          else
            echo "Phase B: nested pins already aligned on backfill branch"
          fi

          if [ "$(git rev-list --count origin/master..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            git_push_phase_b -u origin "HEAD:${BRANCH}" --force-with-lease
          fi

          if [ "$(git rev-list --count origin/master..HEAD 2>/dev/null || echo 0)" -gt 0 ]; then
            existing="$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "Backfill PR already open: #${existing}"
            else
              gh pr create --repo "$REPO" \
                --base master \
                --head "$BRANCH" \
                --title "chore: actions bundle ${TAG} (pins + manifest) [skip actions-release]" \
                --body "$(cat <<EOF
          ## Actions bundle backfill

          - Tag: \`${TAG}\`（已存在于远程；tag 树内 workflow/action/template nested pin 与 tag 一致）
          - Tag SHA: \`${REF}\`
          - tag_created_this_run: ${TAG_CREATED}

          两阶段发版：tag 在 **已对齐全部 nested pin**（含 \`.github/workflows/**\`）的 commit 上打出（须 release-bot App \`workflows:write\`）；本 PR 合入 \`manifest/actions-bundle.yaml\` 与 master 对齐。回填分支由 App token push（**非** \`GITHUB_TOKEN\`）。**PR 标题**（squash subject）与 commit subject 含 \`[skip actions-release]\`，不会再打 tag。
          EOF
          )"
              echo "Opened backfill PR for ${TAG}"
            fi
          else
            echo "No diff vs origin/master; skip PR"
          fi

          {
            echo "### Actions bundle released"
            echo ""
            echo "- **Tag**: \`${TAG}\` (created_this_run=${TAG_CREATED})"
            echo "- **SHA**: \`${REF}\`"
            echo "- Worker bump: \`@${TAG}\`"
            echo "- Backfill: PR branch \`${BRANCH}\`（勿直推 master）"
          } >> "$GITHUB_STEP_SUMMARY"
