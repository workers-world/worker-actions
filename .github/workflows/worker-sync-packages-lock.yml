name: update package-lock.json file

# 按 package.json 刷新 package-lock（GitHub Packages 解析 SDK + 其它依赖）。
# 不修改 package.json——SDK 与其它依赖版本均以开发者提交的 package.json 为准。
#
# 跳过条件（须同时满足，见 package-lock-in-sync / lock-matches-package-json.mjs）：
# 1) 若有 npm:@workers-world/*：lock 已解析至 GitHub Packages（非 file:）且版本与 package.json 一致
# 2) package.json 根 dependencies/devDependencies 与 lock packages[""] 一致
# 3) npm ci --dry-run（仅 run_verify=false 的遗留路径；**run_verify 时省略**，完整校验在 verify job npm ci — #221 Axis C）
# 浅层 + heal 后仍 out of sync → fail；传递依赖/lock 完整性由 verify 内干净 npm ci 硬拦合入。
#
# 由 worker-verify 调用：同 job 内 heal（push dev_* / 同仓 PR）+ run_verify 时浅层 lock 导出（无 dry-run）；也可单独 workflow_call。
# #221 R11：回滚 R10 合并路径——heal 预检与 run_verify 门禁/export 各一次 package-lock-in-sync（已 in-sync 时仍双调用）。
# pull_request 时 checkout/push 目标为 PR head 分支，非 merge ref。bump 可仅改 package.json。
# 需刷新时：全量 npm install（非仅改 SDK 版本字段）；**不在 push 上跑 npm ci**（自托管/网络；PR 门禁校验）。
# npm install/ci 仅当 caller .npmrc 或 npm_config_legacy_peer_deps 启用时才加 --legacy-peer-deps
# （与 package-lock-in-sync / lock-matches-package-json.mjs dry-run 一致；否则 peer deps 须写入 lock）。
# composite action 须全路径 @actions/vX.Y.Z（跨仓 workflow_call 时 ./ 解析到 caller 仓）。
on:
  workflow_call:
    inputs:
      bot:
        description: "git push 凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App mint，须配 RELEASE_BOT_*）。npm 认证不受影响，始终走 GHA_TOKEN/GITHUB_TOKEN（App 无 packages:read）"
        type: string
        default: "pat"
      sync_packages_lock:
        description: "是否在本 job 执行 CI heal（push dev_* / 同仓 pull_request）"
        type: boolean
        default: true
      run_verify:
        description: "true：heal 后跑浅层 lock 导出供 verify job 编排；干净 npm ci 仅在 verify job（#221 Axis C 不再 dry-run）"
        type: boolean
        default: false
      materialize_sdk:
        description: "与 worker-verify 一致；无 SDK 仓不因 lock 漂移 fail PR"
        type: boolean
        default: true
      working_directory:
        description: "含 package.json / package-lock.json 的目录"
        type: string
        default: "."
    outputs:
      in_sync:
        description: lock 已与 package.json 同步（run_verify 门禁步输出）
        value: ${{ jobs.sync-lock.outputs.in_sync }}
      skip:
        description: 非 Node lock 门禁（无 package.json / 无 lock），跳过 lock 门禁
        value: ${{ jobs.sync-lock.outputs.skip }}
    secrets:
      GHA_TOKEN:
        description: read:packages PAT；未传则尝试 GITHUB_TOKEN
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false

permissions:
  contents: write
  packages: read

jobs:
  sync-lock:
    # Prefer GHA_RUNNER on private repos — org ubuntu billing/spending limit blocks ubuntu-latest (2026-10).
    # Previously pinned ubuntu-latest to free grokbot-box for verify (#213); billing broke that tradeoff.
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    outputs:
      in_sync: ${{ steps.export_lock_status.outputs.in_sync }}
      skip: ${{ steps.export_lock_status.outputs.skip }}
    env:
      SYNC_LOCK_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      HEAL_LOCK: >-
        ${{ inputs.sync_packages_lock && (
          (github.event_name == 'push' && startsWith(github.ref_name, 'dev_')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        ) }}
    steps:
      # bot=app：就地 mint 1h App installation token（App push 可触发下游 workflow，与 PAT 等价）；
      # npm 认证与此分离（见 Regenerate 步骤 NODE_AUTH_TOKEN）
      - name: Mint GitHub App token
        id: bot-token
        if: env.HEAL_LOCK == 'true' && inputs.bot == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-contents: write

      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@actions/v0.2.69
        with:
          fetch-depth: ${{ env.HEAL_LOCK == 'true' && 0 || 1 }}
          ref: >-
            ${{ github.event_name == 'pull_request' && (
              env.HEAL_LOCK == 'true' && format('refs/heads/{0}', github.event.pull_request.head.ref) ||
              github.event.pull_request.head.sha
            ) || github.ref }}
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@actions/v0.2.69
        id: lock_check
        if: env.HEAL_LOCK == 'true'
        with:
          working-directory: ${{ inputs.working_directory }}
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          skip_dry_run: "true"

      - name: Lock already in sync
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync == 'true' && steps.lock_check.outputs.skip != 'true'
        run: echo "lock 已与 package.json 同步，跳过刷新"

      - name: Sync git branch before lock heal
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync != 'true'
        run: |
          set -euo pipefail
          git fetch origin "${SYNC_LOCK_BRANCH}"
          git pull --ff-only origin "${SYNC_LOCK_BRANCH}"

      - uses: workers-world/worker-actions/.github/actions/package-lock-refresh@actions/v0.2.69
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync != 'true'
        with:
          working-directory: ${{ inputs.working_directory }}
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit healed package-lock.json
        if: env.HEAL_LOCK == 'true' && steps.lock_check.outputs.in_sync != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .npmrc
          if git diff --cached --quiet; then
            echo "package-lock 与 remote 一致，无需提交"
            exit 0
          fi
          git commit -m "CI action 自动刷新 package-lock（与 package.json 同步）" -m "供 Cloudflare Builds npm ci 安装；含 GitHub Packages @workers-world 根依赖解析。"

          # push 复用 checkout 注入的凭据（persist-credentials）；勿手拼 token-URL（报错时可能泄漏）
          push_with_rebase() {
            git fetch origin "${SYNC_LOCK_BRANCH}"
            git pull --rebase origin "${SYNC_LOCK_BRANCH}"
            git push origin "HEAD:${SYNC_LOCK_BRANCH}"
          }

          if push_with_rebase; then
            exit 0
          fi
          echo "push 被拒，rebase 后重试一次…"
          push_with_rebase

      # run_verify 时 verify job 跑干净 npm ci；此处仅浅层 lock 状态导出（#221 R4 Axis C 删 sync-lock dry-run）
      - uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@actions/v0.2.69
        id: lock_gate
        if: inputs.run_verify
        with:
          working-directory: ${{ inputs.working_directory }}
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          skip_dry_run: "true"

      - name: Fail PR gate when package-lock out of sync
        if: >
          inputs.run_verify &&
          github.event_name == 'pull_request' &&
          inputs.sync_packages_lock &&
          inputs.materialize_sdk &&
          steps.lock_gate.outputs.skip != 'true' &&
          steps.lock_gate.outputs.in_sync != 'true'
        run: |
          echo "::error::PR 门禁：package-lock 与 package.json 仍不同步（sync-lock heal 未成功）；verify npm ci 将作最终硬拦。"
          echo "bump 可仅改 package.json；须配置 Org Secret GHA_TOKEN（read:packages）并确认 sync-lock job 已成功 push lock。"
          echo "勿依赖本地 npm install（开发者网络常无法访问 GitHub Packages）。"
          exit 1

      - name: Export lock job outputs
        id: export_lock_status
        if: always()
        run: |
          set -euo pipefail
          in_sync="${{ steps.lock_gate.outputs.in_sync }}"
          skip="${{ steps.lock_gate.outputs.skip }}"
          if [ -z "$in_sync" ]; then
            in_sync=true
            skip=true
          fi
          echo "in_sync=${in_sync}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"