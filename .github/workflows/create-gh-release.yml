name: Create GitHub Release

# 跨仓通用：tag 已存在时建/更新 GitHub Release 页面。
# Caller 通常为 gh-release-on-tag.yml（on.push.tags）；见 docs/gh-release.md
on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag name (e.g. v1.2.3 or actions/v0.1.1)
        required: true
        type: string
      release_name:
        description: Release title (default Release {tag_name})
        type: string
        default: ""
      generate_release_notes:
        description: Use GitHub auto-generated release notes (ignored when body is set)
        type: boolean
        default: true
      body:
        description: Custom release body (non-empty overrides generate_release_notes)
        type: string
        default: ""
      draft:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
    secrets:
      GHA_TOKEN:
        description: Optional PAT; falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', inputs.tag_name) }}
          body: ${{ inputs.body != '' && inputs.body || '' }}
          generate_release_notes: ${{ inputs.body == '' && inputs.generate_release_notes }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
