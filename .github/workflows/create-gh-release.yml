name: Create GitHub Release

# 跨仓通用：tag 已存在时建/更新 GitHub Release 页面。
# Caller 通常为 gh-release-on-tag.yml（on.push.tags）；见 docs/gh-release.md
on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag name (e.g. v1.2.3 or actions/v0.1.1)
        required: true
        type: string
      release_name:
        description: Release title (default Release {tag_name})
        type: string
        default: ""
      generate_release_notes:
        description: Use GitHub auto-generated release notes (ignored when body is set)
        type: boolean
        default: true
      body:
        description: Custom release body (non-empty overrides generate_release_notes)
        type: string
        default: ""
      draft:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
    secrets:
      GHA_TOKEN:
        description: Optional PAT; falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 无需 checkout：softprops/action-gh-release 经 API 对 tag 建 Release（也消除 artipacked/凭据面）
      # 第三方 action pin full SHA（官方建议：SHA 是唯一不可变引用）；升级由 Dependabot 同步注释
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', inputs.tag_name) }}
          body: ${{ inputs.body != '' && inputs.body || '' }}
          generate_release_notes: ${{ inputs.body == '' && inputs.generate_release_notes }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
