name: 更新默认分支为当前开发分支

# push dev_* 时把仓库默认分支设为数值最高的 dev_XX_YY_ZZ（主分支 = 开发中）。
# master 仍为 Release PR / CF Builds 发布轨；本 workflow 只改 GitHub Default branch 设置。
#
# Caller：使用独立 workflow（推荐，与 CI 解耦）：
#   见 templates/sync-default-branch.yml
# Caller job 须显式 permissions: {}（勿 contents: write / administration），与 callee 交集后 GITHUB_TOKEN 无权限；写操作仅 PAT。
on:
  workflow_call:
    inputs:
      push_branch:
        description: 本次 push 的分支名（用于 skip 优化；空则总是扫描远程）
        type: string
        default: ""
      only_if_push_branch_is_latest:
        description: 仅当 push_branch 等于远程最高 dev 时才执行（减少旧 dev push 的 API 调用）
        type: boolean
        default: true
      bot:
        description: "写操作凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App mint，须配 DEFAULT_BRANCH_BOT_*）。注意：本 workflow 用**独立 App**（administration:write 权限过大，不与 release-bot 混用），见 docs/github-app-token-migration.md §5"
        type: string
        default: "pat"
    secrets:
      GHA_TOKEN:
        description: PAT（repo 权限，改默认分支需 Admin）。未传时步骤内守卫报错
        required: false
      DEFAULT_BRANCH_BOT_PRIVATE_KEY:
        description: workers-world-default-branch-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      DEFAULT_BRANCH_BOT_APP_ID:
        description: App ID（vars.DEFAULT_BRANCH_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false

jobs:
  sync:
    runs-on: ${{ (vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 10
    permissions: {}
    steps:
      # bot=app：独立 App（仅装到需要 sync-default 的仓），mint 1h token
      - name: Mint GitHub App token
        id: bot-token
        if: inputs.bot == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEFAULT_BRANCH_BOT_APP_ID || secrets.DEFAULT_BRANCH_BOT_APP_ID }}
          private-key: ${{ secrets.DEFAULT_BRANCH_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-administration: write

      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          GH_VERSION="2.63.2"
          bindir="${RUNNER_TEMP}/gha-bin"
          mkdir -p "$bindir"
          gh_base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          # 官方 checksums.txt 校验（防下载产物被篡改/镜像投毒）
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/gh.sha256"
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o "${RUNNER_TEMP}/gh.tgz"
          grep " gh_${GH_VERSION}_linux_amd64.tar.gz\$" "${RUNNER_TEMP}/gh.sha256" \
            | sed "s|gh_${GH_VERSION}_linux_amd64.tar.gz|${RUNNER_TEMP}/gh.tgz|" \
            | sha256sum -c -
          tar xz -C "$bindir" --strip-components=2 -f "${RUNNER_TEMP}/gh.tgz" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          chmod +x "$bindir/gh"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gh" --version

      - name: Set default branch to latest dev_*
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          BOT: ${{ inputs.bot }}
          REPO: ${{ github.repository }}
          PUSH_BRANCH: ${{ inputs.push_branch }}
          ONLY_IF_LATEST: ${{ inputs.only_if_push_branch_is_latest }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::缺少写凭证（bot=${BOT}）。bot=pat 请配 GHA_TOKEN（Admin）；bot=app 请配 DEFAULT_BRANCH_BOT_*，见 docs/github-app-token-migration.md。"
            exit 1
          fi

          latest="$(gh api "repos/${REPO}/branches" --paginate -q '.[].name' \
            | grep -E '^dev_[0-9]+_[0-9]+_[0-9]+$' \
            | sort -t_ -k2,2n -k3,3n -k4,4n \
            | tail -1)"
          if [ -z "${latest}" ]; then
            echo "No dev_XX_YY_ZZ branch found, skip."
            exit 0
          fi
          echo "Latest dev branch: ${latest}"

          if [ "${ONLY_IF_LATEST}" = "true" ] && [ -n "${PUSH_BRANCH}" ] && [ "${PUSH_BRANCH}" != "${latest}" ]; then
            echo "Skip: push branch ${PUSH_BRANCH} is not latest (${latest})"
            exit 0
          fi

          current="$(gh api "repos/${REPO}" -q .default_branch)"
          echo "Current default: ${current}"

          if [ "${current}" = "${latest}" ]; then
            echo "Already default: ${latest}"
            exit 0
          fi

          gh api "repos/${REPO}" -X PATCH -f "default_branch=${latest}"
          echo "Default branch updated: ${current} → ${latest}"
