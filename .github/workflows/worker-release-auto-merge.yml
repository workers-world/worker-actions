name: Worker release auto-merge

# Release PR（dev_* → master）在 verify + qodana + OCR 均成功后自动 merge。
# 替代 push 上的 worker-promote-gated FF。
#
# Caller 须在同一 workflow 内 needs: [verify, qodana, ocr] 且仅在 pull_request → master 时调用。
# Caller：permissions: {}（merge 走 PAT，勿 contents/pull-requests write）
on:
  workflow_call:
    inputs:
      pr_number:
        description: github.event.pull_request.number
        required: true
        type: string
      head_ref:
        description: PR head 分支名（须 dev_*）
        required: true
        type: string
      master_branch:
        description: 目标分支
        type: string
        default: master
    secrets:
      GHA_TOKEN:
        description: PAT（repo 权限）；merge PR 必填
        required: true

# 写操作仅走 PAT；GITHUB_TOKEN 保持无权限
permissions: {}

jobs:
  merge:
    runs-on: ${{ (vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 60
    permissions: {}
    steps:
      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          GH_VERSION="2.63.2"
          bindir="${RUNNER_TEMP}/gha-bin"
          mkdir -p "$bindir"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$bindir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
          chmod +x "$bindir/gh"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gh" --version

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ secrets.GHA_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          MASTER_BRANCH: ${{ inputs.master_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::缺少 GHA_TOKEN，无法 auto-merge Release PR。"
            exit 1
          fi
          if ! [[ "$HEAD_REF" =~ ^dev_ ]]; then
            echo "::error::Refusing to auto-merge: head must be dev_* (got ${HEAD_REF})"
            exit 1
          fi
          state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,mergeable,baseRefName --jq '.state')"
          mergeable="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable --jq '.mergeable')"
          base="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName --jq '.baseRefName')"
          if [ "$state" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is ${state}, skip merge"
            exit 0
          fi
          if [ "$base" != "$MASTER_BRANCH" ]; then
            echo "::error::PR base is ${base}, expected ${MASTER_BRANCH}"
            exit 1
          fi
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "::error::PR #${PR_NUMBER} is not mergeable (${mergeable})"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --delete-branch=false
          echo "Merged release PR #${PR_NUMBER} (${HEAD_REF} → ${MASTER_BRANCH})"
