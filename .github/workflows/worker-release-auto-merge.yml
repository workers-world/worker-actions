name: Worker release auto-merge

# Release PR（dev_* → master）在 verify + qodana + OCR 均成功后自动 merge。
# 替代 push 上的 worker-promote-gated FF。
#
# Caller 须在同一 workflow 内 needs: [verify, qodana, ocr] 且仅在 pull_request → master 时调用。
# Caller：permissions: {}（merge 走 PAT，勿 contents/pull-requests write）
on:
  workflow_call:
    inputs:
      pr_number:
        description: github.event.pull_request.number
        required: true
        type: string
      head_ref:
        description: PR head 分支名（须 dev_*）
        required: true
        type: string
      head_sha:
        description: 本次 run 门禁校验过的 PR head SHA（github.event.pull_request.head.sha）；merge 前断言未变
        required: true
        type: string
      master_branch:
        description: 目标分支
        type: string
        default: master
      bot:
        description: "写操作凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App mint，须配 RELEASE_BOT_*，见 docs/github-app-token-migration.md）"
        type: string
        default: "pat"
    secrets:
      GHA_TOKEN:
        description: PAT（repo 权限）；merge PR 必填。未传时步骤内守卫报错
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false

# 写操作仅走 PAT；GITHUB_TOKEN 保持无权限
permissions: {}

jobs:
  merge:
    runs-on: ${{ (vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest') }}
    timeout-minutes: 60
    permissions: {}
    steps:
      # bot=app：就地 mint 1h App installation token；mint 失败显式报错，不静默回落 PAT
      - name: Mint GitHub App token
        id: bot-token
        if: inputs.bot == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-pull-requests: write

      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          GH_VERSION="2.63.2"
          bindir="${RUNNER_TEMP}/gha-bin"
          mkdir -p "$bindir"
          gh_base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          # 官方 checksums.txt 校验（防下载产物被篡改/镜像投毒）
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/gh.sha256"
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o "${RUNNER_TEMP}/gh.tgz"
          grep " gh_${GH_VERSION}_linux_amd64.tar.gz\$" "${RUNNER_TEMP}/gh.sha256" \
            | sed "s|gh_${GH_VERSION}_linux_amd64.tar.gz|${RUNNER_TEMP}/gh.tgz|" \
            | sha256sum -c -
          tar xz -C "$bindir" --strip-components=2 -f "${RUNNER_TEMP}/gh.tgz" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          chmod +x "$bindir/gh"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gh" --version

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          BOT: ${{ inputs.bot }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          MASTER_BRANCH: ${{ inputs.master_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::缺少写凭证（bot=${BOT}）。bot=pat 请配 GHA_TOKEN；bot=app 请配 RELEASE_BOT_*（App ID + 私钥），见 docs/github-app-token-migration.md。"
            exit 1
          fi
          if ! [[ "$HEAD_REF" =~ ^dev_ ]]; then
            echo "::error::Refusing to auto-merge: head must be dev_* (got ${HEAD_REF})"
            exit 1
          fi
          state="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,mergeable,baseRefName --jq '.state')"
          mergeable="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable --jq '.mergeable')"
          base="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json baseRefName --jq '.baseRefName')"
          if [ "$state" != "OPEN" ]; then
            echo "PR #${PR_NUMBER} is ${state}, skip merge"
            exit 0
          fi
          if [ "$base" != "$MASTER_BRANCH" ]; then
            echo "::error::PR base is ${base}, expected ${MASTER_BRANCH}"
            exit 1
          fi
          # TOCTOU 守卫：门禁只验证过 EXPECTED_HEAD_SHA；synchronize 会取消本 run 但取消是异步的，
          # 若 PR head 已前移（新 push 未验证），旧 run 不得合入，由新 push 触发的 run 接管。
          head_oid="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          if [ "$head_oid" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR #${PR_NUMBER} head 已变为 ${head_oid}（本 run 验证的是 ${EXPECTED_HEAD_SHA}），拒绝 merge；等待新 push 触发的 run 重跑门禁。"
            exit 1
          fi
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "::error::PR #${PR_NUMBER} is not mergeable (${mergeable})"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --delete-branch=false
          echo "Merged release PR #${PR_NUMBER} (${HEAD_REF} → ${MASTER_BRANCH})"
