name: Worker notify Release PR blocked

# Release PR（dev_* → master）未能 auto-merge、需人工介入时发邮件。
# 通道：workers-world/action-notify-email@v1 → notify-worker /v1/send。
#
# Caller（pull_request → master，needs 含 release-auto-merge）：
#   if: always() && needs.release-auto-merge.result != 'success' && …
#   uses: workers-world/worker-actions/.github/workflows/worker-notify-release-pr-blocked.yml@actions/v0.2.65
#   secrets: inherit
# caller 须授予 annotations 拉取权限（发信仍走 NOTIFY_*；GHA nested 权限不能超过 caller）：
#   permissions: { actions: read, checks: read, pull-requests: read }
# 跨仓拉取 workers-world/worker-actions 可传 GHA_TOKEN；公开仓可省略，回退 github.token
# Org：NOTIFY_WORKER_URL = Variable；NOTIFY_GHA_TOKEN = Secret（secrets: inherit）
# 勿在 caller 显式 secrets: NOTIFY_WORKER_URL（本 workflow 未声明该 secret；属历史破坏性变更，升级 bundle 时须同步迁移）
# 发送前 Guard：vars/secret 为空则 fail；发信瞬时失败仍 fail-on-error:false
on:
  workflow_call:
    inputs:
      pr_number:
        description: github.event.pull_request.number
        required: true
        type: string
      head_ref:
        description: PR head 分支名（dev_*）
        required: true
        type: string
      pr_url:
        description: PR html_url
        required: true
        type: string
      verify_result:
        description: needs.verify.result
        required: true
        type: string
      qodana_result:
        description: needs.qodana.result
        required: true
        type: string
      merge_result:
        description: needs.release-auto-merge.result
        required: true
        type: string
      actions_bundle_ref:
        description: 拉取 tools/gh-run-annotations.mjs 的 workers-world/worker-actions git ref（仅 actions/vX.Y.Z 或 40 位 SHA）
        required: false
        type: string
        default: actions/v0.1.3
      node_version:
        description: Node.js 版本（gh-run-annotations.mjs；self-hosted 由 setup-node 安装）
        type: string
        default: "24"
    secrets:
      NOTIFY_GHA_TOKEN:
        description: 与 notify-worker NOTIFY_GHA_TOKEN 同值（Org Secret）。未配置时由 Guard 步骤显式报错
        required: false
      GHA_TOKEN:
        description: 跨仓拉取 workers-world/worker-actions 用 PAT（私有仓须传；公开仓可省略，回退 github.token）
        required: false

jobs:
  notify:
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      schedule_debounce_flush: ${{ steps.flush_gate.outputs.schedule }}
    permissions:
      checks: read
      actions: read
      pull-requests: read
    steps:
      - name: Guard GHA_TOKEN
        env:
          WW_TOKEN: ${{ secrets.GHA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WW_TOKEN:-}" ]; then
            echo "::notice::未传 GHA_TOKEN，checkout workers-world/worker-actions 将回退 github.token（公开仓可用）。"
          fi

      - name: Validate actions_bundle_ref
        env:
          ACTIONS_BUNDLE_REF: ${{ inputs.actions_bundle_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if echo "${ACTIONS_BUNDLE_REF}" | grep -Eq '^actions/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            :
          elif echo "${ACTIONS_BUNDLE_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            :
          else
            echo "::error::actions_bundle_ref 须为 actions/vX.Y.Z 或 40 位 commit SHA，当前格式非法"
            exit 1
          fi

      - name: Checkout annotation helper
        uses: actions/checkout@v7.0.1
        with:
          repository: workers-world/worker-actions
          ref: ${{ inputs.actions_bundle_ref }}
          path: .ww-gha
          fetch-depth: 1
          token: ${{ (secrets.GHA_TOKEN != '' && secrets.GHA_TOKEN) || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Collect workflow annotations
        id: ann
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_BUNDLE_REF: ${{ inputs.actions_bundle_ref }}
        run: |
          set -euo pipefail
          HELPER=".ww-gha/tools/gh-run-annotations.mjs"
          if [ ! -f "${HELPER}" ]; then
            # 静态文本，定界符无碰撞风险；动态内容一律用随机定界符（见 Build reason）
            {
              echo "annotations<<ANN_STATIC_DELIM"
              echo "(annotation helper 未在 ref=${ACTIONS_BUNDLE_REF} 中发布)"
              echo "ANN_STATIC_DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "${HELPER}"

      - name: Resolve PR state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_NUMBER}" --json state -q .state 2>/dev/null || echo OPEN)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Preflight reason class
        id: preflight
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VERIFY: ${{ inputs.verify_result }}
          QODANA: ${{ inputs.qodana_result }}
          MERGE: ${{ inputs.merge_result }}
          ANNOTATIONS: ${{ steps.ann.outputs.annotations }}
          REASON_CLASS_ONLY: "true"
          ACTIONS_BUNDLE_REF: ${{ inputs.actions_bundle_ref }}
        run: |
          set -euo pipefail
          NOTIFY_STEP=".ww-gha/tools/release-pr-blocked-notify-step.mjs"
          if [ -f "${NOTIFY_STEP}" ]; then
            node "${NOTIFY_STEP}"
          else
            echo "reason_class=legacy" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore notify cooldown cache
        id: cooldown
        uses: actions/cache/restore@v6
        with:
          path: .notify-cooldown-ts
          key: notify-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.preflight.outputs.reason_class }}

      - name: Restore notify debounce cache
        id: debounce
        uses: actions/cache/restore@v6
        with:
          path: .notify-debounce-ts
          key: notify-debounce-${{ github.repository }}-${{ inputs.pr_number }}

      - name: Build notify decision and email
        id: meta
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          PR_URL: ${{ inputs.pr_url }}
          VERIFY: ${{ inputs.verify_result }}
          QODANA: ${{ inputs.qodana_result }}
          MERGE: ${{ inputs.merge_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANNOTATIONS: ${{ steps.ann.outputs.annotations }}
          PR_STATE: ${{ steps.pr.outputs.state }}
          ACTIONS_BUNDLE_REF: ${{ inputs.actions_bundle_ref }}
        run: |
          set -euo pipefail
          if [ -f .notify-cooldown-ts ]; then
            COOLDOWN_SENT_AT="$(tr -d ' \n\r' < .notify-cooldown-ts)"
            export COOLDOWN_SENT_AT
          else
            export COOLDOWN_SENT_AT=""
          fi
          if [ -f .notify-debounce-ts ]; then
            DEBOUNCE_FIRST_SEEN_AT="$(tr -d ' \n\r' < .notify-debounce-ts)"
            export DEBOUNCE_FIRST_SEEN_AT
          else
            export DEBOUNCE_FIRST_SEEN_AT=""
          fi

          NOTIFY_STEP=".ww-gha/tools/release-pr-blocked-notify-step.mjs"
          if [ -f "${NOTIFY_STEP}" ]; then
            node "${NOTIFY_STEP}"
            exit 0
          fi

          echo "::warning::notify-step 未在 ref=${ACTIONS_BUNDLE_REF} 中发布；回退旧版 bash 原因 + 邮件构建（无冷却降噪；仍尊重 PR 状态）"
          PR_STATE_N="$(printf '%s' "${PR_STATE:-}" | tr '[:lower:]' '[:upper:]')"
          if [ "$PR_STATE_N" = "MERGED" ] || [ "$PR_STATE_N" = "CLOSED" ]; then
            echo "send_notify=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=pr_not_open" >> "$GITHUB_OUTPUT"
            echo "reason_class=legacy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reasons=()
          if [ "$VERIFY" = "failure" ]; then
            reasons+=("verify 失败：检查 dev_* push / 测试 / SDK 依赖")
          fi
          if [ "$QODANA" = "failure" ]; then
            reasons+=("Qodana 未通过：查看 PR Checks / SARIF 评论")
          fi
          if [ "$MERGE" = "failure" ]; then
            reasons+=("release-auto-merge 失败：可能冲突或不可 merge，查看 merge job 日志")
          elif [ "$MERGE" = "skipped" ] && \
               { [ "$VERIFY" = "success" ] || [ "$VERIFY" = "skipped" ]; } && \
               { [ "$QODANA" = "success" ] || [ "$QODANA" = "skipped" ]; }; then
            if [ "$VERIFY" = "success" ] && [ "$QODANA" = "success" ]; then
              reasons+=("门禁已通过但 release-auto-merge 被跳过（merge=skipped）：常见原因是 PR 仍为 draft（require_non_draft_pr），或 merge job 的 if 未满足；请 Ready for review 后重跑")
            else
              reasons+=("release-auto-merge 被跳过（merge=skipped；verify=${VERIFY} qodana=${QODANA}）：门禁 job 可能未实际运行（skipped），请检查 job if / 路径过滤，勿仅按 draft 排查")
            fi
          elif [ "$VERIFY" = "success" ] && [ "$QODANA" = "success" ] && [ "$MERGE" != "success" ]; then
            reasons+=("门禁全绿但未 merge（merge=${MERGE}）：查看 release-auto-merge 日志")
          fi
          if [ "${#reasons[@]}" -eq 0 ]; then
            reasons+=("未能 auto-merge（verify=${VERIFY} qodana=${QODANA} merge=${MERGE}）")
          fi
          REASONS="$(printf '%s\n' "${reasons[@]}")"
          export REASONS
          echo "send_notify=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          echo "reason_class=legacy" >> "$GITHUB_OUTPUT"
          MAIL_HELPER=".ww-gha/tools/build-release-pr-blocked-email.mjs"
          if [ -f "${MAIL_HELPER}" ]; then
            node "${MAIL_HELPER}"
          else
            echo "::warning::邮件 HTML 构建脚本未在 ref=${ACTIONS_BUNDLE_REF:-} 中发布；仅发纯文本（notify-worker 仍会 auto-linkify URL）"
            BODY_DELIM="body_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "subject=[Release PR] ${REPO} #${PR_NUMBER} 需人工处理"
              echo "body<<${BODY_DELIM}"
              echo "Release PR 未能自动合入 master，需要人工介入。"
              echo ""
              echo "Repo: ${REPO}"
              echo "PR: #${PR_NUMBER} (${HEAD_REF} → master)"
              echo "URL: ${PR_URL}"
              echo "Actions: ${RUN_URL}"
              echo ""
              echo "Results: verify=${VERIFY} qodana=${QODANA} merge=${MERGE}"
              echo ""
              echo "原因："
              for r in "${reasons[@]}"; do
                echo "- ${r}"
              done
              echo ""
              echo "Actions 产物 / Annotations："
              echo "----------------------------------------"
              if [ -n "${ANNOTATIONS:-}" ]; then
                printf '%s\n' "${ANNOTATIONS}" | sed 's/^::/ ::/'
              else
                echo "(无 annotations 或未拉取到)"
              fi
              echo "----------------------------------------"
              echo ""
              echo "修复后 push 到 ${HEAD_REF} 会更新本 PR 并重跑门禁。"
              echo "${BODY_DELIM}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log notify skip
        if: steps.meta.outputs.send_notify != 'true'
        env:
          SKIP_REASON: ${{ steps.meta.outputs.skip_reason }}
          REASON_CLASS: ${{ steps.meta.outputs.reason_class }}
        run: |
          set -euo pipefail
          echo "::notice::跳过 Release PR 阻断邮件（reason=${SKIP_REASON:-unknown} class=${REASON_CLASS:-})"

      # vars 无 required；空 URL + fail-on-error:false 会让发信静默跳过。配置缺失必须显式失败。
      - name: Guard notify channel config
        if: steps.meta.outputs.send_notify == 'true'
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NOTIFY_WORKER_URL:-}" ]; then
            echo "::error::Org Variable NOTIFY_WORKER_URL 未配置或对本仓库不可见（vars 求值为空）。阻断邮件通道不可用。"
            missing=1
          fi
          if [ -z "${NOTIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Org Secret NOTIFY_GHA_TOKEN 未配置或对本仓库不可见。阻断邮件通道不可用。"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "notify channel config ok (NOTIFY_WORKER_URL length=${#NOTIFY_WORKER_URL})"

      - name: Send notify email
        id: notify
        if: steps.meta.outputs.send_notify == 'true'
        # Pin full commit（tag v1 / v1.1.0 → 259fd263…；核验：git ls-remote workers-world/action-notify-email）
        uses: workers-world/action-notify-email@9afa638644ab4612153792d4d6394a83897ec00b # v1.1.4
        with:
          subject: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          html: ${{ steps.meta.outputs.html }}
          dedup-key: release-pr-blocked-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.meta.outputs.reason_class }}
          fail-on-error: "false"
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}

      # fail-on-error:false 吞掉瞬时失败；此处对 ok!=true 显式失败，避免无效配置/通道故障静默
      # 契约已核实：workers-world/action-notify-email@259fd263 输出 ok / skipped / error
      - name: Fail if notify send unsuccessful
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok != 'true' && steps.notify.outputs.skipped != 'true'
        env:
          NOTIFY_ERROR: ${{ steps.notify.outputs.error }}
          NOTIFY_SKIPPED: ${{ steps.notify.outputs.skipped }}
        run: |
          set -euo pipefail
          # 转义行首 :: 防 GHA workflow command 注入（与 ANNOTATIONS 处理一致）
          SAFE_ERR="$(printf '%s' "${NOTIFY_ERROR:-unknown}" | tr '\r\n' '  ' | sed 's/^::/ ::/')"
          echo "::error::notify-worker send failed (ok!=true skipped=${NOTIFY_SKIPPED:-} error=${SAFE_ERR})；请检查 NOTIFY_WORKER_URL / NOTIFY_GHA_TOKEN 与 notify-worker 可达性"
          exit 1

      - name: Write debounce timestamp for cache
        if: steps.meta.outputs.save_debounce_at != ''
        run: |
          set -euo pipefail
          printf '%s' "${{ steps.meta.outputs.save_debounce_at }}" > .notify-debounce-ts

      - name: Save notify debounce cache
        if: steps.meta.outputs.save_debounce_at != ''
        uses: actions/cache/save@v6
        with:
          path: .notify-debounce-ts
          key: notify-debounce-${{ github.repository }}-${{ inputs.pr_number }}

      - name: Write cooldown timestamp for cache
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok == 'true'
        run: |
          set -euo pipefail
          date +%s000 > .notify-cooldown-ts

      - name: Save notify cooldown cache
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: .notify-cooldown-ts
          key: notify-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.meta.outputs.reason_class }}

      - name: Debounce flush gate
        id: flush_gate
        if: always() && steps.meta.outcome == 'success'
        run: |
          set -euo pipefail
          skip="${{ steps.meta.outputs.skip_reason }}"
          save="${{ steps.meta.outputs.save_debounce_at }}"
          if [ "$skip" = "debounce_pending" ] && [ -n "$save" ]; then
            echo "schedule=true" >> "$GITHUB_OUTPUT"
          else
            echo "schedule=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack debounce flush context
        if: steps.flush_gate.outputs.schedule == 'true'
        env:
          DEBOUNCE_FIRST_SEEN_MS: ${{ steps.meta.outputs.save_debounce_at }}
          REASON_CLASS: ${{ steps.meta.outputs.reason_class }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          PR_URL: ${{ inputs.pr_url }}
          VERIFY: ${{ inputs.verify_result }}
          QODANA: ${{ inputs.qodana_result }}
          MERGE: ${{ inputs.merge_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANNOTATIONS: ${{ steps.ann.outputs.annotations }}
        run: |
          set -euo pipefail
          PACK=".ww-gha/tools/write-debounce-flush-context.mjs"
          if [ ! -f "${PACK}" ]; then
            echo "::error::debounce flush 需要 write-debounce-flush-context.mjs（升级 actions bundle）"
            exit 1
          fi
          node "${PACK}"

      - name: Upload debounce flush context
        if: steps.flush_gate.outputs.schedule == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debounce-flush-context
          path: .notify-flush-context.json
          retention-days: 1

  # 无后续 synchronize 时由 ubuntu-latest 等待 debounce 窗口后补发（不占 org self-hosted runner）。
  debounce_flush:
    needs: notify
    if: needs.notify.outputs.schedule_debounce_flush == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      actions: read
      pull-requests: read
    steps:
      - name: Validate actions_bundle_ref
        env:
          ACTIONS_BUNDLE_REF: ${{ inputs.actions_bundle_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if echo "${ACTIONS_BUNDLE_REF}" | grep -Eq '^actions/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            :
          elif echo "${ACTIONS_BUNDLE_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            :
          else
            echo "::error::actions_bundle_ref 须为 actions/vX.Y.Z 或 40 位 commit SHA，当前格式非法"
            exit 1
          fi

      - name: Checkout annotation helper
        uses: actions/checkout@v7.0.1
        with:
          repository: workers-world/worker-actions
          ref: ${{ inputs.actions_bundle_ref }}
          path: .ww-gha
          fetch-depth: 1
          token: ${{ (secrets.GHA_TOKEN != '' && secrets.GHA_TOKEN) || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Download debounce flush context
        uses: actions/download-artifact@v7
        with:
          name: debounce-flush-context

      - name: Wait for debounce window
        env:
          FLUSH_CTX_FILE: .notify-flush-context.json
        run: |
          set -euo pipefail
          DEBOUNCE_FIRST_SEEN_AT="$(node -e "const c=require('fs').readFileSync(process.env.FLUSH_CTX_FILE,'utf8'); const j=JSON.parse(c); if(!j.debounceFirstSeenAtMs) process.exit(1); process.stdout.write(String(j.debounceFirstSeenAtMs));")"
          export DEBOUNCE_FIRST_SEEN_AT
          WAIT_SCRIPT=".ww-gha/tools/debounce-flush-wait.mjs"
          if [ ! -f "${WAIT_SCRIPT}" ]; then
            echo "::error::debounce flush 需要 debounce-flush-wait.mjs（升级 actions bundle）"
            exit 1
          fi
          node "${WAIT_SCRIPT}"

      - name: Resolve PR state after debounce
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_NUMBER}" --json state -q .state 2>/dev/null || echo OPEN)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Restore notify cooldown cache
        id: cooldown
        env:
          FLUSH_CTX_FILE: .notify-flush-context.json
        run: |
          set -euo pipefail
          reason_class="$(node -e "const j=JSON.parse(require('fs').readFileSync(process.env.FLUSH_CTX_FILE,'utf8')); process.stdout.write(j.reasonClass||'other');")"
          echo "reason_class=${reason_class}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: cooldown_cache
        with:
          path: .notify-cooldown-ts
          key: notify-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.cooldown.outputs.reason_class }}

      - name: Build notify decision and email (flush)
        id: meta
        env:
          FLUSH_CTX_FILE: .notify-flush-context.json
          PR_STATE: ${{ steps.pr.outputs.state }}
        run: |
          set -euo pipefail
          FLUSH_STEP=".ww-gha/tools/debounce-flush-notify-step.mjs"
          if [ ! -f "${FLUSH_STEP}" ]; then
            echo "::error::debounce flush 需要 debounce-flush-notify-step.mjs（升级 actions bundle）"
            exit 1
          fi
          node "${FLUSH_STEP}"

      - name: Log notify skip (flush)
        if: steps.meta.outputs.send_notify != 'true'
        env:
          SKIP_REASON: ${{ steps.meta.outputs.skip_reason }}
          REASON_CLASS: ${{ steps.meta.outputs.reason_class }}
        run: |
          set -euo pipefail
          echo "::notice::debounce flush 跳过 Release PR 阻断邮件（reason=${SKIP_REASON:-unknown} class=${REASON_CLASS:-})"

      - name: Guard notify channel config (flush)
        if: steps.meta.outputs.send_notify == 'true'
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NOTIFY_WORKER_URL:-}" ]; then
            echo "::error::Org Variable NOTIFY_WORKER_URL 未配置或对本仓库不可见（vars 求值为空）。阻断邮件通道不可用。"
            missing=1
          fi
          if [ -z "${NOTIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Org Secret NOTIFY_GHA_TOKEN 未配置或对本仓库不可见。阻断邮件通道不可用。"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Send notify email (flush)
        id: notify
        if: steps.meta.outputs.send_notify == 'true'
        uses: workers-world/action-notify-email@9afa638644ab4612153792d4d6394a83897ec00b # v1.1.4
        with:
          subject: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          html: ${{ steps.meta.outputs.html }}
          dedup-key: release-pr-blocked-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.meta.outputs.reason_class }}
          fail-on-error: "false"
        env:
          NOTIFY_WORKER_URL: ${{ vars.NOTIFY_WORKER_URL }}
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}

      - name: Fail if notify send unsuccessful (flush)
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok != 'true' && steps.notify.outputs.skipped != 'true'
        env:
          NOTIFY_ERROR: ${{ steps.notify.outputs.error }}
          NOTIFY_SKIPPED: ${{ steps.notify.outputs.skipped }}
        run: |
          set -euo pipefail
          SAFE_ERR="$(printf '%s' "${NOTIFY_ERROR:-unknown}" | tr '\r\n' '  ' | sed 's/^::/ ::/')"
          echo "::error::debounce flush notify send failed (skipped=${NOTIFY_SKIPPED:-} error=${SAFE_ERR})"
          exit 1

      - name: Write cooldown timestamp for cache (flush)
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok == 'true'
        run: |
          set -euo pipefail
          date +%s000 > .notify-cooldown-ts

      - name: Save notify cooldown cache (flush)
        if: steps.meta.outputs.send_notify == 'true' && steps.notify.outputs.ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: .notify-cooldown-ts
          key: notify-${{ github.repository }}-${{ inputs.pr_number }}-${{ steps.meta.outputs.reason_class }}