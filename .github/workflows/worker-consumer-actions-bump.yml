name: Consumer actions pin bump

# WW-150 org fanout: open/update bump PRs on upgradable consumers when a new annotated
# actions/v* tag is created. Consumer list from deploy-tracker GET /v1/consumers (WW-151).
# See docs/consumer-actions-bump.md
on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing actions/vX.Y.Z to bump to"
        required: true
        type: string
      consumer_repo:
        description: "Optional single consumer (owner/name). Empty = API fanout."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Rewrite only; do not push or open PR"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: consumer-actions-bump-${{ github.event_name }}-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: >
      vars.ACTIONS_AUTO_BUMP != 'false' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'create' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref_name, 'actions/v')
        )
      )
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.require-annotated-tag.outputs.skip }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      target_tag: ${{ steps.validate-tag.outputs.target_tag }}
      dry_run: ${{ steps.env.outputs.dry_run }}
    env:
      RELEASE_BOT_APP_ID_EFFECTIVE: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
      TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      CONSUMER_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.consumer_repo || vars.CONSUMER_REPO || '' }}
      CONSUMERS_API_BASE: ${{ vars.CONSUMERS_API_BASE || 'https://deploy.mailworld.uk' }}
      CONSUMERS_DEP: ${{ vars.CONSUMERS_DEP || 'worker-actions' }}
      CONSUMERS_STATUS: ${{ vars.CONSUMERS_STATUS || 'upgradable' }}
    steps:
      - name: Validate tag name
        id: validate-tag
        run: |
          set -euo pipefail
          if ! [[ "${TARGET_TAG}" =~ ^actions/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TARGET_TAG must be actions/vX.Y.Z, got: ${TARGET_TAG}"
            exit 1
          fi
          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"

      - id: env
        run: |
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/consumer-actions-bump
            .github/actions/ensure-gh-cli
          persist-credentials: false

      - uses: ./.github/actions/ensure-gh-cli

      - name: Gate P1 — checkout tag tree for nested pin scan
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TARGET_TAG }}
          path: tag-tree
          sparse-checkout: |
            .github/actions
            .github/workflows
            templates
            docs/templates
          persist-credentials: false

      - name: Gate P1 — tag nested @actions/v* integrity
        env:
          TAG_TREE_ROOT: tag-tree
          TARGET_TAG: ${{ env.TARGET_TAG }}
        run: node tools/consumer-actions-bump/verify-tag-nested-pins.mjs

      - name: Require annotated tag (create event only)
        id: require-annotated-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ env.TARGET_TAG }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${EVENT_NAME}" != "create" ]; then
            echo "Non-create event: skip annotated-tag gate"
            exit 0
          fi
          obj_type="$(gh api "repos/${REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.type')"
          if [ "${obj_type}" != "tag" ]; then
            echo "::notice::Skip consumer bump: ref ${TARGET_TAG} is not an annotated tag (object.type=${obj_type})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Annotated tag ${TARGET_TAG} confirmed"

      - name: Resolve consumer matrix
        id: resolve
        if: steps.require-annotated-tag.outputs.skip != 'true'
        env:
          CONSUMER_REPO: ${{ env.CONSUMER_REPO }}
          CONSUMERS_API_BASE: ${{ env.CONSUMERS_API_BASE }}
          CONSUMERS_DEP: ${{ env.CONSUMERS_DEP }}
          CONSUMERS_STATUS: ${{ env.CONSUMERS_STATUS }}
          RULES_ADMIN_TOKEN: ${{ secrets.RULES_ADMIN_TOKEN }}
        run: node tools/consumer-actions-bump/fetch-consumers.mjs

  bump:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    env:
      RELEASE_BOT_APP_ID_EFFECTIVE: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
      TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      CONSUMER_REPO: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/consumer-actions-bump
            .github/actions/ensure-gh-cli
          persist-credentials: false

      - uses: ./.github/actions/ensure-gh-cli

      - name: Mint GitHub App token (consumer repo)
        id: bot-token
        if: env.RELEASE_BOT_APP_ID_EFFECTIVE != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.RELEASE_BOT_APP_ID_EFFECTIVE }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: workers-world
          repositories: ${{ matrix.short_name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Validate write credentials
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Consumer bump requires release-bot App token with Contents + Pull requests + Workflows write on ${CONSUMER_REPO}."
            echo "Configure RELEASE_BOT_APP_ID (Variable or Secret) + RELEASE_BOT_PRIVATE_KEY; install workers-world-release-bot on ${CONSUMER_REPO}."
            echo "See docs/consumer-actions-bump.md and docs/github-app-token-migration.md."
            exit 1
          fi

      - name: Bump consumer workflow pins
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          CONSUMER_REPO: ${{ env.CONSUMER_REPO }}
          TARGET_TAG: ${{ env.TARGET_TAG }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: node tools/consumer-actions-bump/bump-consumer.mjs
