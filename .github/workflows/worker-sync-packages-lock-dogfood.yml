name: update package-lock.json file (dogfood)

# 本仓 dogfood 专用：嵌套 composite 用 ./ 相对路径，勿 pin 尚未存在的 @actions/v* tag。
# 跨仓 caller 仍走 worker-sync-packages-lock.yml（全路径 @actions/vX.Y.Z）。
on:
  workflow_call:
    inputs:
      bot:
        description: "git push 凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App mint，须配 RELEASE_BOT_*）。npm 认证不受影响，始终走 GHA_TOKEN/GITHUB_TOKEN（App 无 packages:read）"
        type: string
        default: "pat"
    secrets:
      GHA_TOKEN:
        description: read:packages PAT；未传则尝试 GITHUB_TOKEN
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false

permissions:
  contents: write
  packages: read

jobs:
  sync-lock:
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    env:
      SYNC_LOCK_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Mint GitHub App token
        id: bot-token
        if: inputs.bot == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@44bf242b6ad9c2b4f4c6d59280d8229e3ab3ee9b
        id: lock_check
        with:
          node_auth_token: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          skip_dry_run: "true"

      - name: Lock already in sync
        if: steps.lock_check.outputs.in_sync == 'true' && steps.lock_check.outputs.skip != 'true'
        run: echo "lock 已与 package.json 同步，跳过刷新"

      - name: Regenerate package-lock.json from GitHub Packages
        if: steps.lock_check.outputs.in_sync != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! grep -q 'framework_sdk_worker' package.json; then
            echo "package.json 无 framework_sdk_worker，跳过"
            exit 0
          fi

          git fetch origin "${SYNC_LOCK_BRANCH}"
          git pull --ff-only origin "${SYNC_LOCK_BRANCH}"

          WANT_VER="$(node -e '
            const s = require("./package.json").dependencies?.framework_sdk_worker || "";
            const m = String(s).match(/@([0-9]+\.[0-9]+\.[0-9]+)/);
            if (!m) {
              console.error("package.json 中 framework_sdk_worker 须为 npm:@workers-world/framework_sdk_worker@X.Y.Z");
              process.exit(1);
            }
            process.stdout.write(m[1]);
          ')"

          lock_matches_version() {
            [[ -f package-lock.json ]] \
              && grep -q 'npm.pkg.github.com' package-lock.json \
              && ! grep -q '"\.\./framework_sdk_worker"' package-lock.json \
              && grep -q "framework_sdk_worker/${WANT_VER}/" package-lock.json
          }

          root_deps_in_sync() {
            [[ -f package-lock.json ]] || return 1
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              const root = lock.packages?.[""] || {};
              function same(a, b) {
                const aa = a || {};
                const bb = b || {};
                const keys = new Set([...Object.keys(aa), ...Object.keys(bb)]);
                for (const k of keys) {
                  if (String(aa[k] ?? "") !== String(bb[k] ?? "")) process.exit(1);
                }
              }
              same(pkg.dependencies, root.dependencies);
              same(pkg.devDependencies, root.devDependencies);
            '
          }

          if [[ ! -f .npmrc ]] || ! grep -q 'npm.pkg.github.com' .npmrc; then
            {
              echo '@workers-world:registry=https://npm.pkg.github.com'
              echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}'
            } >> .npmrc
          fi
          rm -rf node_modules/framework_sdk_worker
          if [[ -f package-lock.json ]] && grep -q '"\.\./framework_sdk_worker"' package-lock.json; then
            echo "移除 file: link 残留 lock，重新生成"
            rm -f package-lock.json
          fi
          NPM_COMMON_ARGS=(--no-fund --no-audit)
          if [ "${{ steps.lock_check.outputs.legacy_peer_deps }}" = "true" ]; then
            NPM_COMMON_ARGS+=(--legacy-peer-deps)
            echo "caller 启用 legacy-peer-deps，npm install/ci 将带上 --legacy-peer-deps"
          else
            echo "caller 未启用 legacy-peer-deps，npm install/ci 写入/校验完整 peer 依赖树"
          fi
          echo "按 package.json 全量刷新 lock → framework_sdk_worker@${WANT_VER}"
          npm install "${NPM_COMMON_ARGS[@]}"
          echo "push sync-lock 不跑 npm ci（网络/自托管）；干净 npm ci 仅在 PR 门禁（与 Cloudflare Builds 对齐）"
          rm -rf node_modules
          if ! lock_matches_version; then
            echo "::error::package-lock 未解析到 @workers-world/framework_sdk_worker@${WANT_VER}。请确认 Packages 已发布且 GHA_TOKEN/read 权限正常。"
            exit 1
          fi
          if ! root_deps_in_sync; then
            echo "::error::刷新后 package-lock 根依赖仍与 package.json 不一致。"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .npmrc
          if git diff --cached --quiet; then
            echo "package-lock 与 remote 一致，无需提交"
            exit 0
          fi
          git commit -m "CI action 自动刷新 package-lock（GitHub Packages SDK ${WANT_VER}）" -m "供 Cloudflare Builds npm ci 安装；含 package.json 根依赖同步。"

          push_with_rebase() {
            git fetch origin "${SYNC_LOCK_BRANCH}"
            git pull --rebase origin "${SYNC_LOCK_BRANCH}"
            git push origin "HEAD:${SYNC_LOCK_BRANCH}"
          }

          if push_with_rebase; then
            exit 0
          fi
          echo "push 被拒，rebase 后重试一次…"
          push_with_rebase
