name: Worker verify

# 本地 package.json 可继续 file:../framework_sdk_worker；
# CI 从 GitHub Packages 物化同路径，避免 git clone + build SDK。
#
# Caller 典型用法（sync-lock 已内置；promote 默认 false，日常走 Release PR）：
#   permissions: { contents: write, packages: read }  # promote=true 时 contents 可降为 {}（写走 PAT）
#   uses: workers-world/worker-actions/.github/workflows/worker-verify.yml@actions/v0.2.61
#   with:
#     sync_packages_lock: true   # push dev_* 时按 package.json 刷新 lock 并提交
#     run_verify: true           # false：仅 sync-lock（push 默认；门禁在 PR）
#
# PR verify checkout PR head SHA（非 pull/N/merge），与 qodana 一致，避免 stale merge ref 导致 npm ci 失败。
# sync-lock 与 verify 编排（#132：bump 可仅改 package.json，lock 由 CI heal）：
#   push dev_* / 同仓 pull_request：sync-lock job 内 heal + 浅层 lock 导出；干净 npm ci 仅在 verify job（#221 R4 Axis C）。
#   verify npm ci 为 PR 硬门禁（#221 R9 回滚 R8：correctness_on_builds 仍跑 npm ci/物化/cache 与 check∥test；R13 回滚 R12 cache 跳过）；heal 失败则 fail。
#   bot lock push 仍 synchronize PR；Node **24** 字面量（与 Cloudflare Builds 对齐）。
# 无 SDK（materialize_sdk: false）时不因 lock 未同步跳过 verify（与旧 wait 行为一致）。
# SDK 版本唯一来源：caller 仓 package.json 的 framework_sdk_worker（npm:@workers-world/...@X.Y.Z）。
# promote 默认 false：合入 master 走 ensure-release-pr + OCR 门禁 + release-auto-merge。
# 仅遗留/应急仓设 promote: true（经 worker-promote：开 PR → gh pr merge，禁止直推 master）。
# 无 framework_sdk_worker 的仓（如 manim-playground）：materialize_sdk: false；无 npm test 时 run_tests: false。
#
# 鉴权（403 read_package 时按序检查）：
# 1. Org/仓 Secret GHA_TOKEN（PAT：read:packages，推荐）
# 2. 或 Package「Manage Actions access」授权调用方仓库 + caller permissions.packages:read
on:
  workflow_call:
    inputs:
      node_version:
        description: "已废弃（忽略）；CI 固定 Node 24，与 Cloudflare Builds 对齐"
        type: string
        default: "24"
      promote:
        description: push 到 dev_* 且 verify 绿时，经 Release PR merge 到 master（禁止直推；日常 Release PR 仓须 false）
        type: boolean
        default: false
      master_branch:
        description: 目标主干分支名
        type: string
        default: "master"
      sync_packages_lock:
        description: push dev_* 与同仓 PR 上按 package.json 刷新 package-lock（CI heal；须 GHA_TOKEN read:packages）并 bot 提交
        type: boolean
        default: false
      materialize_sdk:
        description: 是否从 GitHub Packages 物化 framework_sdk_worker（无 SDK 依赖的仓设 false）
        type: boolean
        default: true
      run_tests:
        description: 是否执行 npm test（无 test 脚本的仓设 false）
        type: boolean
        default: true
      run_verify:
        description: "是否跑 npm ci/check/test（默认 true）。false 时仍可跑 sync-lock（push 只刷 lock、门禁留在 PR）"
        type: boolean
        default: true
      correctness_on_builds:
        description: "true：Release PR 仍跑 GHA check∥test 与 node_modules cache（R13 回滚 R12）；npm ci 硬门禁 + Workers Builds preview + gate（#221 R7；R9 回滚 R8 npm ci 跳过）"
        type: boolean
        default: false
      bot:
        description: "sync-lock git push 凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App，须配 RELEASE_BOT_*）。npm 认证不走 App（无 packages:read）；promote 嵌套链暂走 PAT"
        type: string
        default: "pat"
      working_directory:
        description: "含 package.json / package-lock.json 的目录（默认仓库根；dogfood / 子项目用）"
        type: string
        default: "."
    secrets:
      GHA_TOKEN:
        description: 读 Packages / 写 master 的 PAT；未传则尝试 GITHUB_TOKEN
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时透传给 sync-lock；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退）
        required: false

# Caller 须授予至少 packages:read；promote 写 master 走 PAT（permissions 可保持 packages:read）
permissions:
  contents: write
  packages: read

jobs:
  sync-lock:
    if: >
      (
        inputs.sync_packages_lock &&
        (
          (
            github.event_name == 'push' &&
            startsWith(github.ref_name, 'dev_')
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      ) ||
      inputs.run_verify
    # 跨仓调用时 ./ 与 $/ 均不可靠；须写全路径并 pin 与本 bundle 同 tag
    uses: workers-world/worker-actions/.github/workflows/worker-sync-packages-lock.yml@actions/v0.2.61
    with:
      bot: ${{ inputs.bot }}
      sync_packages_lock: ${{ inputs.sync_packages_lock }}
      run_verify: ${{ inputs.run_verify }}
      materialize_sdk: ${{ inputs.materialize_sdk }}
      working_directory: ${{ inputs.working_directory }}
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}

  verify:
    needs: sync-lock
    if: >
      always() &&
      inputs.run_verify &&
      (needs.sync-lock.result == 'success' || needs.sync-lock.result == 'skipped') &&
      (
        needs.sync-lock.result == 'skipped' ||
        needs.sync-lock.outputs.skip == 'true' ||
        needs.sync-lock.outputs.in_sync == 'true' ||
        !(inputs.sync_packages_lock && inputs.materialize_sdk)
      )
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    permissions:
      contents: read
      packages: read
      actions: write
    env:
      SYNC_LOCK_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      # 私有仓 + GHA_RUNNER：自托管（#213 不在此路径 save setup-node/npm/node_modules Actions cache）
      VERIFY_ON_SELF_HOSTED: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && 'true' || 'false' }}
    steps:
      - uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@actions/v0.2.61
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Pull lock commit from sync-lock job
        if: needs.sync-lock.result == 'success'
        run: git pull --ff-only origin "${SYNC_LOCK_BRANCH}"

      - name: Detect npm verify scope
        id: npm_scope
        shell: bash
        run: |
          set -euo pipefail
          pkg="package.json"
          lock="package-lock.json"
          if [ ! -f "$pkg" ]; then
            echo "::notice::无 package.json，跳过 npm verify（container / 纯 Python 等仓）"
            echo "run_npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$lock" ] && [ "${{ inputs.materialize_sdk }}" != "true" ]; then
            echo "::notice::无 package-lock.json 且 materialize_sdk=false，跳过 npm verify"
            echo "run_npm=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_npm=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7.1.0
        if: steps.npm_scope.outputs.run_npm == 'true'
        id: setup_node
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"
          # self-hosted 上 Post setup-node 写 npm cache 曾占 verify 墙钟 ~2/3（#213 Phase A+）；托管 runner 保留 tarball cache
          cache: ${{ env.VERIFY_ON_SELF_HOSTED == 'true' && false || 'npm' }}
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}

      # #221 R6 Axis A：托管 runner 恢复 node_modules（dogfood 已验证 ~5s p50 级 win）；自托管不 restore/save
      # （rev1#70 Save 大 tree 卡 lease）。自托管仅用 npm ci --prefer-offline 吃 runner 本地 ~/.npm。
      # save 放在 check∥test 之后，避免 cache 上传挡 verify 关键路径。
      - name: Restore node_modules cache
        if: steps.npm_scope.outputs.run_npm == 'true' && env.VERIFY_ON_SELF_HOSTED != 'true'
        uses: actions/cache/restore@v6
        id: node_modules_cache
        with:
          path: ${{ inputs.working_directory == '.' && 'node_modules' || format('{0}/node_modules', inputs.working_directory) }}
          key: verify-deps-v1-${{ runner.os }}-node24-lock-${{ inputs.working_directory == '.' && hashFiles('package-lock.json') || hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}

      - name: Materialize SDK from GitHub Packages
        if: steps.npm_scope.outputs.run_npm == 'true' && inputs.materialize_sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_GHA_TOKEN: ${{ secrets.GHA_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_GHA_TOKEN}" != "true" ]; then
            echo "::warning::未配置 GHA_TOKEN，改用 GITHUB_TOKEN。跨仓读 Packages 常 403；请设 Org Secret GHA_TOKEN（read:packages），或在包设置里给本仓开 Actions read。"
          fi
          SDK_SPEC="$(node -e '
            const dep = require("./package.json").dependencies?.framework_sdk_worker || "";
            const fromPkg = dep.startsWith("npm:") ? dep.slice(4) : dep;
            if (!/^@workers-world\/framework_sdk_worker@[0-9]+\.[0-9]+\.[0-9]+$/.test(fromPkg)) {
              console.error("package.json framework_sdk_worker 须为 npm:@workers-world/framework_sdk_worker@X.Y.Z，当前:", dep);
              process.exit(1);
            }
            process.stdout.write(fromPkg);
          ')"
          pack_dir="$(mktemp -d)"
          sdk_dir="${GITHUB_WORKSPACE}/../framework_sdk_worker"
          mkdir -p "$sdk_dir"
          if ! (
            cd "$pack_dir"
            npm pack "${SDK_SPEC}"
          ); then
            echo "::error::npm pack ${SDK_SPEC} 失败（多为 403 read_package）。修复：1) Org Secrets 增加 GHA_TOKEN（classic PAT: read:packages）；2) github.com/orgs/workers-world/packages → framework_sdk_worker → Package settings → Manage Actions access → 添加本仓库 Read。"
            exit 1
          fi
          tar -xzf "$pack_dir"/*.tgz -C "$sdk_dir" --strip-components=1
          test -f "$sdk_dir/package.json"
          test -d "$sdk_dir/dist"
          # 已发布包 files 仅含 dist，无 scripts/；若 package.json 仍有 prepare，
          # 而 Worker lock 还是 link:../framework_sdk_worker，npm ci 会跑钩子并失败。
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            if (j.scripts) {
              delete j.scripts.prepare;
              delete j.scripts.prepublishOnly;
              delete j.scripts.prepublish;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "$sdk_dir/package.json"
          echo "SDK materialized at $sdk_dir ($(node -p "require('$sdk_dir/package.json').version"))"

      # lock 为 file:../ 时 npm ci 走物化目录，不访问 Packages；sync-lock 后 lock 指向
      # npm.pkg.github.com，此处必须带 NODE_AUTH_TOKEN（.npmrc 用 ${NODE_AUTH_TOKEN}）。
      # #221 R6：cache-hit / 自托管 → --prefer-offline（仍完整 npm ci 硬门禁）；lock 变则 key 变 → 全量 ci。
      - name: Run npm ci
        if: steps.npm_scope.outputs.run_npm == 'true'
        run: |
          set -euo pipefail
          common=(--no-fund --no-audit)
          prefer=false
          if [ "${VERIFY_ON_SELF_HOSTED}" = "true" ]; then
            prefer=true
          elif [ "${{ steps.node_modules_cache.outputs.cache-hit }}" = "true" ]; then
            prefer=true
          elif [ "${{ steps.setup_node.outputs.cache-hit }}" = "true" ]; then
            prefer=true
          fi
          if [ "$prefer" = "true" ]; then
            npm ci --prefer-offline "${common[@]}"
          else
            npm ci "${common[@]}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      # #221 R5 Axis B（verify）：check∥test 并行；R13 回滚 R12：correctness_on_builds 仍跑 GHA check∥test
      - name: npm run check and test
        if: steps.npm_scope.outputs.run_npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          set -uo pipefail
          ec=0
          separate_test="$(node -e '
            const scripts = require("./package.json").scripts || {};
            const check = (scripts.check || "").trim();
            const test = (scripts.test || "").trim();
            let out = "false";
            if (process.env.RUN_TESTS === "true" && test) {
              if (!check) {
                out = "true";
              } else {
                const norm = (s) => s.replace(/\s+/g, " ");
                const checkNorm = norm(check);
                if (
                  checkNorm !== norm(test) &&
                  checkNorm !== "npm test" &&
                  checkNorm !== "npm run test"
                ) {
                  out = "true";
                }
              }
            }
            process.stdout.write(out);
          ')"
          npm run check &
          pid_check=$!
          if [ "$separate_test" = "true" ]; then
            npm test &
            pid_test=$!
          fi
          wait "$pid_check" || ec=1
          if [ "$separate_test" = "true" ]; then
            wait "$pid_test" || ec=1
          fi
          exit "$ec"

      - name: Save node_modules cache
        if: >-
          steps.npm_scope.outputs.run_npm == 'true' &&
          env.VERIFY_ON_SELF_HOSTED != 'true' &&
          steps.node_modules_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ inputs.working_directory == '.' && 'node_modules' || format('{0}/node_modules', inputs.working_directory) }}
          key: verify-deps-v1-${{ runner.os }}-node24-lock-${{ inputs.working_directory == '.' && hashFiles('package-lock.json') || hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}

  promote:
    needs: verify
    if: >
      inputs.promote &&
      inputs.run_verify &&
      github.event_name == 'push' &&
      startsWith(github.ref_name, 'dev_')
    # 写操作走 PAT；勿给 GITHUB_TOKEN contents:write 直推 master
    # （bot=app 试点期 promote 嵌套链暂走 PAT：与 SDK 物化的 packages 读共用 GHA_TOKEN，
    #   全量切 App 需先完成包「Manage Actions access」授权，见 docs/github-app-token-migration.md §4）
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-promote.yml@actions/v0.2.61
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
    with:
      release_branch: ${{ github.ref_name }}
      master_branch: ${{ inputs.master_branch }}