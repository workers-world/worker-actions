name: Worker ensure release PR

# push 到纯 destin dev_X_Y_Z（^dev_[0-9]+_[0-9]+_[0-9]+$）时确保存在一条 dev → master 的 Release PR。
# 开 PR 前若 dev 未包含 master，先 merge master 入 dev 并 push（干净则继续；见 docs/release-pr-ci.md）。
# 若 merge 冲突且**仅** package.json / lockfile，自动保留 destin（--ours）并完成 merge + lock 对齐；其它冲突 fail-closed。
# 默认创建即 ready；门禁全绿后 worker-ci 的 require_non_draft_pr + auto-merge 合入 master。
# create_draft_release_pr: true 可恢复 draft 闸门（控 Cloudflare Builds 频率）。
# preflight（#221 Round 3 Axis D）：compare API 判定空 Release / 已有 open PR 时跳过 checkout·sync；skip_lock_precheck 省略 push 后重复 lock 门控。
#
# Caller（push job）：
#   if: worker-ci pure-destin-gate release_track + push（勿仅用 startsWith dev_）
#   permissions: {}   # 建 PR 走 PAT，勿 contents/pull-requests
#   uses: workers-world/worker-actions/.github/workflows/worker-ensure-release-pr.yml@actions/v0.2.52
#   secrets: inherit   # 或显式映射 workflow_call.secrets（GHA_TOKEN、RELEASE_BOT_*）
#   with:
#     release_branch: ${{ github.ref_name }}
on:
  workflow_call:
    inputs:
      release_branch:
        description: 当前 dev_* 分支名
        required: true
        type: string
      master_branch:
        description: 发布目标分支
        type: string
        default: master
      pr_title_prefix:
        description: PR 标题前缀
        type: string
        default: "release:"
      create_draft_release_pr:
        description: "true：新建 Release PR 为 draft（Ready for review 后才 auto-merge）。false（默认）：创建即 ready"
        type: boolean
        default: false
      bot:
        description: "写操作凭证通道：pat（默认，GHA_TOKEN）| app（GitHub App mint，须配 RELEASE_BOT_*，见 docs/github-app-token-migration.md）"
        type: string
        default: "pat"
      skip_lock_precheck:
        description: "true：push 侧 sync-lock 已成功，跳过本 job 内重复的 package-lock-in-sync（#221 Round 3 Axis B/D）"
        type: boolean
        default: false
    outputs:
      pr_number:
        description: 当前 dev_* → master 的 open Release PR 号（已有或新建）
        value: ${{ jobs.ensure.outputs.pr_number }}
    secrets:
      GHA_TOKEN:
        description: PAT（repo 权限）；bot=pat 时必填。Org 常禁止 GITHUB_TOKEN 建 PR。未传时步骤内守卫报错
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: workers-world-release-bot App 私钥（bot=app 时必填；Org Secret）
        required: false
      RELEASE_BOT_APP_ID:
        description: App ID（vars.RELEASE_BOT_APP_ID 未配时的 Secret 回退；bot=app 时必填其一）
        required: false

# 写操作仅走 PAT；GITHUB_TOKEN 保持无权限
permissions: {}

jobs:
  ensure:
    runs-on: ${{ github.event.repository.private && vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions: {}
    outputs:
      pr_number: ${{ steps.export.outputs.pr_number }}
    steps:
      # bot=app：就地 mint 1h 短周期 App installation token（默认仅当前仓 scope）；
      # mint 失败会显式报错（fail-closed），不会静默回落 PAT
      - name: Mint GitHub App token
        id: bot-token
        if: inputs.bot == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID || secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-pull-requests: write
          permission-contents: write

      # permissions: {} 时 GITHUB_TOKEN 无法拉取私有仓 composite action（codeload 404）；内联安装 gh
      # （若 bundle 仓转私有，此内联是唯一可靠路径；公开仓也可改用 ensure-gh-cli composite）
      - name: Ensure GitHub CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          GH_VERSION="2.63.2"
          bindir="${RUNNER_TEMP}/gha-bin"
          mkdir -p "$bindir"
          gh_base="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          # 官方 checksums.txt 校验（防下载产物被篡改/镜像投毒）
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_checksums.txt" -o "${RUNNER_TEMP}/gh.sha256"
          curl -fsSL "${gh_base}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o "${RUNNER_TEMP}/gh.tgz"
          grep " gh_${GH_VERSION}_linux_amd64.tar.gz\$" "${RUNNER_TEMP}/gh.sha256" \
            | sed "s|gh_${GH_VERSION}_linux_amd64.tar.gz|${RUNNER_TEMP}/gh.tgz|" \
            | sha256sum -c -
          tar xz -C "$bindir" --strip-components=2 -f "${RUNNER_TEMP}/gh.tgz" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          chmod +x "$bindir/gh"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/gh" --version

      - name: Validate write credentials
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          BOT: ${{ inputs.bot }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::缺少写凭证（bot=${BOT}）。bot=pat 请在 Org Secrets 配置 GHA_TOKEN（classic PAT: repo）；bot=app 请配 Org Variable RELEASE_BOT_APP_ID + Org Secret RELEASE_BOT_PRIVATE_KEY，见 docs/github-app-token-migration.md。"
            exit 1
          fi

      # API-only preflight：空 Release（ahead=0）或已有 open PR 且仅需维护时跳过 checkout/sync（#221 Round 3 Axis D）
      - name: Preflight release PR necessity
        id: preflight
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          MASTER_BRANCH: ${{ inputs.master_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_BRANCH" =~ ^dev_[0-9]+_[0-9]+_[0-9]+$ ]]; then
            echo "short_circuit=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "reason=non_pure_destin" >> "$GITHUB_OUTPUT"
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "Skip: release_branch must be pure destin dev_X_Y_Z (numeric segments only)"
            exit 0
          fi
          existing="$(gh pr list --repo "$REPO" --head "$RELEASE_BRANCH" --base "$MASTER_BRANCH" --state open --json number --jq '.[0].number // empty')"
          ahead_by="$(gh api "repos/${REPO}/compare/${MASTER_BRANCH}...${RELEASE_BRANCH}" --jq '.ahead_by')"
          behind_by="$(gh api "repos/${REPO}/compare/${MASTER_BRANCH}...${RELEASE_BRANCH}" --jq '.behind_by')"
          needs_sync=false
          if [ "${behind_by}" != "0" ]; then
            needs_sync=true
          fi
          echo "needs_sync=${needs_sync}" >> "$GITHUB_OUTPUT"
          if [ -n "${existing}" ] && [ "${ahead_by}" != "0" ] && [ "${behind_by}" = "0" ]; then
            echo "short_circuit=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${existing}" >> "$GITHUB_OUTPUT"
            echo "reason=open_release_pr_unchanged" >> "$GITHUB_OUTPUT"
            echo "::notice::Short-circuit ensure-release-pr: open Release PR #${existing} already covers ${ahead_by} commit(s) ahead of ${MASTER_BRANCH}"
            exit 0
          fi
          if [ "${ahead_by}" = "0" ] && [ "${behind_by}" = "0" ]; then
            echo "short_circuit=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${existing}" >> "$GITHUB_OUTPUT"
            echo "reason=empty_release" >> "$GITHUB_OUTPUT"
            echo "::notice::Short-circuit ensure-release-pr: no commits on ${RELEASE_BRANCH} ahead of ${MASTER_BRANCH} (0-file / empty release)"
            exit 0
          fi
          echo "short_circuit=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "reason=needs_work" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        if: steps.preflight.outputs.short_circuit != 'true' && (steps.preflight.outputs.needs_sync == 'true' || inputs.skip_lock_precheck != true)
        uses: workers-world/worker-actions/.github/actions/checkout-with-transient-retry@actions/v0.2.52
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_branch }}
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}

      - name: Require package-lock in sync before release PR
        if: steps.preflight.outputs.short_circuit != 'true' && inputs.skip_lock_precheck != true
        # 跨仓 workflow_call 时 uses: ./ 解析到 caller 仓；见 docs/actions-releases.md
        uses: workers-world/worker-actions/.github/actions/package-lock-in-sync@actions/v0.2.52
        id: lock_gate
        with:
          skip_dry_run: "true"

      - name: Fail when lock still out of sync after push sync-lock
        if: steps.preflight.outputs.short_circuit != 'true' && inputs.skip_lock_precheck != true && steps.lock_gate.outputs.skip != 'true' && steps.lock_gate.outputs.in_sync != 'true'
        run: |
          echo "::error::dev 分支 package-lock 与 package.json 仍不同步；ensure-release-pr 拒绝开/维护 Release PR。"
          echo "请确认 push 侧 sync-lock 已成功 push lock（bump 可仅含 package.json；勿要求本地刷新 lock）。见 docs/release-pr-ci.md。"
          exit 1

      - name: Sync master into release branch before release PR
        id: sync-master
        if: steps.preflight.outputs.short_circuit != 'true' && steps.preflight.outputs.needs_sync == 'true'
        # 跨仓 workflow_call 时 uses: ./ 解析到 caller 仓；见 docs/actions-releases.md
        uses: workers-world/worker-actions/.github/actions/sync-master-into-release-branch@actions/v0.2.52
        with:
          release_branch: ${{ inputs.release_branch }}
          master_branch: ${{ inputs.master_branch }}
          repo: ${{ github.repository }}
          gh_token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          node_auth_token: ${{ secrets.GHA_TOKEN }}

      - name: Open release PR if missing
        id: open-pr
        if: steps.preflight.outputs.short_circuit != 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN }}
          BOT: ${{ inputs.bot }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          MASTER_BRANCH: ${{ inputs.master_branch }}
          PR_TITLE_PREFIX: ${{ inputs.pr_title_prefix }}
          CREATE_DRAFT: ${{ inputs.create_draft_release_pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::缺少写凭证（bot=${BOT}）。bot=pat 请在 Org Secrets 配置 GHA_TOKEN（classic PAT: repo）；bot=app 请配 Org Variable RELEASE_BOT_APP_ID + Org Secret RELEASE_BOT_PRIVATE_KEY，见 docs/github-app-token-migration.md。"
            exit 1
          fi
          if ! [[ "$RELEASE_BRANCH" =~ ^dev_[0-9]+_[0-9]+_[0-9]+$ ]]; then
            echo "Skip: release_branch must be pure destin dev_X_Y_Z (numeric segments only)"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing="$(gh pr list --repo "$REPO" --head "$RELEASE_BRANCH" --base "$MASTER_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Release PR already open: #${existing}"
            echo "pr_number=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ahead_by="$(gh api "repos/${REPO}/compare/${MASTER_BRANCH}...${RELEASE_BRANCH}" --jq '.ahead_by')"
          if [ "${ahead_by}" = "0" ]; then
            echo "Skip: no commits on ${RELEASE_BRANCH} ahead of ${MASTER_BRANCH} (nothing to release)"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DRAFT_ARGS=()
          if [ "${CREATE_DRAFT}" = "true" ]; then
            DRAFT_ARGS=(--draft)
          fi
          pr_create_err="$(mktemp)"
          if ! gh pr create --repo "$REPO" \
            --base "$MASTER_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "${PR_TITLE_PREFIX} ${RELEASE_BRANCH} → ${MASTER_BRANCH}" \
            "${DRAFT_ARGS[@]}" \
            --body "$(cat <<'EOF'
          ## Release PR（自动创建）

          - push 到 `dev_*` 会更新本 PR（默认 **ready for review**）
          - verify（+ 可选 Qodana/OCR）全绿后 CI 自动 merge 到 `master`（`require_non_draft_pr` 仍要求非 draft）
          - 若需延后合入：可 **Convert to draft**，或 caller 传 `create_draft_release_pr: true`
          - 任一门禁失败时请修复后 push，或人工处理 PR

          > 由 `worker-ensure-release-pr` 创建。
          EOF
          )" 2>"${pr_create_err}"; then
            if grep -q 'No commits between' "${pr_create_err}"; then
              echo "Skip: no commits between ${MASTER_BRANCH} and ${RELEASE_BRANCH} (gh pr create)"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "${pr_create_err}" >&2
            exit 1
          fi
          new="$(gh pr list --repo "$REPO" --head "$RELEASE_BRANCH" --base "$MASTER_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$new" ]; then
            echo "::error::PR 创建后未能解析 number（head=${RELEASE_BRANCH} base=${MASTER_BRANCH}）"
            exit 1
          fi
          echo "Created release PR #${new} (draft=${CREATE_DRAFT})"
          echo "pr_number=${new}" >> "$GITHUB_OUTPUT"

      - name: Export job outputs
        id: export
        if: always() && !cancelled()
        env:
          FROM_PREFLIGHT: ${{ steps.preflight.outputs.pr_number }}
          FROM_OPEN: ${{ steps.open-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -n "${FROM_OPEN}" ]; then
            echo "pr_number=${FROM_OPEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${FROM_PREFLIGHT}" ]; then
            echo "pr_number=${FROM_PREFLIGHT}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi
