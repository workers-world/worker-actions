name: Package lock in sync check
description: 检查 package-lock.json 是否与 package.json（含 framework_sdk_worker SDK 版本）同步，并通过 npm ci --dry-run 校验 lock 可安装性

inputs:
  working-directory:
    description: 含 package.json 的目录
    required: false
    default: "."
  node_auth_token:
    description: 读 GitHub Packages 的 token（npm ci --dry-run 完整性校验；未传则 fail-closed）
    required: false
    default: ""
  skip_dry_run:
    description: "true 时跳过 npm ci --dry-run（dev_* push sync-lock 用；PR 门禁须 false）"
    required: false
    default: "false"

outputs:
  in_sync:
    description: lock 已与 package.json 同步
    value: ${{ steps.check.outputs.in_sync }}
  skip:
    description: package.json 无 framework_sdk_worker
    value: ${{ steps.check.outputs.skip }}
  legacy_peer_deps:
    description: caller 是否配置 legacy-peer-deps（sync-lock npm install/ci 须与此一致）
    value: ${{ steps.check.outputs.legacy_peer_deps }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      if: inputs.node_auth_token != ''
      with:
        node-version: "24"
        registry-url: https://npm.pkg.github.com
        scope: "@workers-world"

    - id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.node_auth_token }}
        LOCK_CHECK_SKIP_DRY_RUN: ${{ inputs.skip_dry_run == 'true' && '1' || '' }}
      run: |
        set -euo pipefail
        action_dir="${{ github.action_path }}"
        script="${action_dir}/lock-matches-package-json.mjs"
        legacy_peer_deps="$(node "${action_dir}/npm-ci-legacy-peer-deps.mjs")"
        echo "legacy_peer_deps=${legacy_peer_deps}" >> "$GITHUB_OUTPUT"
        if node "$script"; then
          echo "in_sync=true" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "package.json 无 framework_sdk_worker，跳过"
            exit 0
          fi
          echo "in_sync=false" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
