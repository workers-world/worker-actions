name: Qodana scan gate
description: Org opt-in + 路径过滤 + PR 内限频，判定是否执行 Qodana Docker 扫描
inputs:
  org_enabled:
    description: Org Variable WORKERS_WORLD_QODANA_ENABLED（true/1/yes 才扫描）
    required: false
    default: ""
  base_ref:
    description: PR base 分支名
    required: false
    default: master
  head_sha:
    description: PR head commit SHA
    required: false
    default: ""
  throttle_minutes:
    description: 同一 PR 两次全量扫描最小间隔（分钟）；0=禁用限频
    required: false
    default: "30"
  custom_paths:
    description: 覆盖默认路径 filter（每行一个 glob，空=内置默认）
    required: false
    default: ""
  pr_action:
    description: github.event.action
    required: false
    default: ""
  cache_state_file:
    description: 上次扫描状态 JSON 路径（actions/cache 恢复）
    required: false
    default: ""
outputs:
  should_scan:
    description: true 时执行 Docker 扫描
    value: ${{ steps.gate.outputs.should_scan }}
  skip_reason:
    description: should_scan=false 时的原因
    value: ${{ steps.gate.outputs.skip_reason }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      run: |
        set -euo pipefail
        ORG="${{ inputs.org_enabled }}"
        ARGS=(node "${{ github.action_path }}/gate.mjs")
        ARGS+=(--org-enabled "${ORG}")
        ARGS+=(--base-ref "${{ inputs.base_ref }}")
        ARGS+=(--head-sha "${{ inputs.head_sha }}")
        ARGS+=(--throttle-minutes "${{ inputs.throttle_minutes }}")
        ARGS+=(--pr-action "${{ inputs.pr_action }}")
        if [ -n "${{ inputs.custom_paths }}" ]; then
          ARGS+=(--custom-paths "${{ inputs.custom_paths }}")
        fi
        CACHE="${{ inputs.cache_state_file }}"
        if [ -n "${CACHE}" ] && [ -f "${CACHE}" ]; then
          ARGS+=(--cache-path "${CACHE}")
        fi
        ORG_ON="$(node -e "
          const v = process.argv[1];
          if (v == null || String(v).trim() === '') process.stdout.write('0');
          else if (/^(true|1|yes)$/i.test(String(v).trim())) process.stdout.write('1');
          else process.stdout.write('0');
        " "${ORG}")"
        if [ "${ORG_ON}" = "1" ]; then
          BASE="${{ inputs.base_ref }}"
          git fetch origin "${BASE}" --depth=1 2>/dev/null || git fetch origin "${BASE}"
          mapfile -t CHANGED < <(git diff --name-only "origin/${BASE}...HEAD" || true)
          for f in "${CHANGED[@]}"; do
            [ -n "${f}" ] && ARGS+=(--changed-file "${f}")
          done
        fi
        RESULT="$("${ARGS[@]}")"
        echo "${RESULT}"
        should_scan="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).shouldScan))" "${RESULT}")"
        skip_reason="$(node -e "const o=JSON.parse(process.argv[1]);process.stdout.write(String(o.skipReason??''))" "${RESULT}")"
        echo "should_scan=${should_scan}" >> "$GITHUB_OUTPUT"
        echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
