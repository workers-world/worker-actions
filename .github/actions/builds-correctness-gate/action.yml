name: Workers Builds correctness gate
description: |
  #221 Round 16：主路径 Cloudflare Workers Builds API（PR head commit + worker external_script_id）；
  未配置或暂态失败时回退 GitHub Check（cloudflare-workers-and-pages）。
  自适应 poll 2s→5s→10s→cap 20s，首轮立即查询，fail-closed。
inputs:
  head_sha:
    description: PR head commit SHA（与 release-auto-merge head_sha 一致）
    required: true
  check_context:
    description: "可选：GitHub check 名子串或全名（monorepo 多 Worker）；空=该 commit 上全部 CF Builds check 须 success（回退路径）"
    required: false
    default: ""
  timeout_minutes:
    description: 等待 Builds 的最长分钟数
    required: false
    default: "45"
  cloudflare_account_id:
    description: Cloudflare Account ID（空则跳过 CF API，仅用 GitHub Check 回退）
    required: false
    default: ""
  cloudflare_worker_tag:
    description: Worker external_script_id（Builds API worker tag，非 Worker 显示名）
    required: false
    default: ""
  cloudflare_api_token:
    description: Cloudflare API Token（Workers CI Read）；须经 secrets 传入，勿写死在 workflow
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Wait for Cloudflare Workers Builds
      shell: bash
      env:
        HEAD_SHA: ${{ inputs.head_sha }}
        CHECK_CONTEXT: ${{ inputs.check_context }}
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        GITHUB_TOKEN: ${{ github.token }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
        CLOUDFLARE_WORKER_TAG: ${{ inputs.cloudflare_worker_tag }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/gate.mjs" \
          --owner "${REPO_OWNER}" \
          --repo "${REPO_NAME}" \
          --head-sha "${HEAD_SHA}" \
          --check-context "${CHECK_CONTEXT}" \
          --timeout-seconds "$((TIMEOUT_MINUTES * 60))" \
          --cf-account-id "${CLOUDFLARE_ACCOUNT_ID}" \
          --cf-worker-tag "${CLOUDFLARE_WORKER_TAG}"
