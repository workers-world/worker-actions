# Release PR + auto-merge（全仓默认模板；AI review 可选，非门禁）
# workers-world actions bundle: actions/v0.2.39+（禁止 @master）
# 推荐门面 worker-ci.yml — 见 templates/ci-release-pr.yml
#
# Caller：secrets: inherit（推荐），或显式映射 worker-ci workflow_call secrets：
#   GHA_TOKEN, RELEASE_BOT_*, QODANA_TOKEN, AI_REVIEW_LLM_TOKEN, AI_REVIEW_LLM_* , NOTIFY_GHA_TOKEN
#
# 已移除 alibaba OCR（open-code-review / OCR_LLM_*）。AI 审查见 docs/ai-review/README.md

name: CI

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["master", "dev_*"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
    uses: workers-world/worker-actions/.github/workflows/worker-ci.yml@actions/v0.2.59
    secrets: inherit
    with:
      sync_packages_lock: true
      correctness_on_builds: true
      # builds_check_context: "Cloudflare Workers and Pages: script-name"
      # skip_workflow_lint: false  # 可选：Release PR 恢复 workflow-lint（默认 true）
      # skip_ai_review: false   # 试点：Org 配置 AI_REVIEW_LLM_TOKEN 后打开